name: portfolio-refresh

# Runs daily at 09:00 GMT (UTC), plus manual trigger.
on:
  schedule:
    - cron: '0 9 * * 1-5'   # weekdays, 09:00 GMT
  workflow_dispatch: {}

# Allow the workflow to push the updated JSON back to the repo.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: fetch IBKR flex statement
        env:
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
        run: |
          mkdir -p ui_kits/personal_site/data
          python3 ui_kits/personal_site/scripts/ibkr-flex/fetch-ibkr.py \
            > ui_kits/personal_site/data/portfolio.json
          echo "first 400 bytes of result:"
          head -c 400 ui_kits/personal_site/data/portfolio.json

      - name: commit + push if changed
        run: |
          git config user.name  "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          if git diff --quiet ui_kits/personal_site/data/portfolio.json; then
            echo "no changes"
            exit 0
          fi
          git add ui_kits/personal_site/data/portfolio.json
          git commit -m "portfolio: refresh $(date -u +%F)"
          git push
