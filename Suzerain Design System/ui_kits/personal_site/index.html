<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="suzerain — personal site: portfolio, prediction markets, and live trading dashboards.">
<!-- The site publishes live NAV, position-level holdings and dated transfers, so
     it is deliberately not for search. robots.txt carries `Disallow: /`, but that
     only asks a crawler not to fetch — a crawler that fetches anyway (and every
     one that ignores robots.txt does) needs to be told not to index, and that is
     this tag. The pair is belt and braces, not redundancy. Note the interaction:
     a crawler that honors the Disallow never fetches the page and so never reads
     this line, which is why the URL can still surface bare if linked externally.
     Link previews are unaffected — unfurlers read the og: tags below regardless. -->
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="suzerain">
<meta property="og:description" content="Portfolio, prediction markets, and live trading dashboards.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://iamsuzerain.github.io/">
<title>suzerain</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='ng'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23c4b5fd'/%3E%3Cstop%20offset='0.5'%20stop-color='%23a78bfa'/%3E%3Cstop%20offset='1'%20stop-color='%23ff4fd8'/%3E%3C/linearGradient%3E%3CclipPath%20id='m'%3E%3Ccircle%20cx='32'%20cy='32'%20r='24'/%3E%3C/clipPath%3E%3C/defs%3E%3Ccircle%20cx='32'%20cy='32'%20r='24'%20stroke='%23a78bfa'%20stroke-width='1.5'%20fill='none'/%3E%3Cg%20clip-path='url%28%23m%29'%20transform='rotate%28-15%2032%2032%29'%3E%3Crect%20x='-8'%20y='-8'%20width='40'%20height='80'%20fill='url%28%23ng%29'/%3E%3C/g%3E%3C/svg%3E">
<link rel="alternate" type="application/rss+xml" title="suzerain — thoughts" href="feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter+Tight:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  /* ========== Chrome ========== */
  /* overflow-x:clip, not hidden. `hidden` turns body into a scroll container,
     and a sticky descendant sticks to its nearest scroll container — which is
     why .sz-nav never stuck to the top of the window. `clip` suppresses the
     same sideways overflow without creating that container. */
  html, body { margin: 0; padding: 0; min-height: 100vh; background: var(--ink-1); overflow-x: clip; }
  /* `clip`, not `hidden`. overflow:hidden makes this a scroll container, and a
     sticky descendant sticks to its nearest scroll container — so .sz-nav has
     never actually stuck; it scrolled away with the page. overflow:clip does
     the same clipping without creating that container, so sticky works again.
     The decorative layers inside are position:fixed and clip to the viewport
     either way, so nothing else changes. */
  .sz-chrome { position: relative; min-height: 100vh; overflow: clip; }

  /* base violet bloom — keep */
  .sz-grid {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(rgba(167,139,250,0.06) 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.5;
  }
  .sz-aurora {
    position: fixed; top: -200px; right: -200px; width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(167,139,250,0.12), transparent 60%);
    pointer-events: none; z-index: 0;
  }

  /* ========== City window photo ========== */
  /* The view out the window — a real photo. Sits behind everything. */
  .sz-skyline-wrap {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    overflow: hidden;
  }
  .sz-skyline-photo {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    /* The photo is the heaviest thing the site serves and it is on every route,
       so it pays for itself in AVIF: the same 2560x1440 pixels at q58 are 234KB
       against the 4.1MB baseline JPEG, and at 1:1 both the lit windows and the
       rain streaks — the low-contrast detail a lossy codec erases first — come
       through. Two declarations rather than one: a browser without image-set()
       drops the second and keeps the url() above it, which is why the .jpg is
       now a 508KB progressive re-encode and not the original master (that is
       still in git history if it is ever wanted back).
       No narrow-viewport tier on purpose. background-size: cover on a portrait
       phone scales by height, so 1440px tall is already being upscaled ~1.8x
       there — mobile wants more pixels than the desktop does, not fewer, and a
       downscaled variant would only buy ~150KB by making the worst case softer.
       If mobile ever needs its own file it should be a portrait crop, which is
       a composition decision, not a compression one. */
    background-image: url('assets/window-view.jpg');
    background-image: image-set(
      url('assets/window-view.avif') type('image/avif'),
      url('assets/window-view.webp') type('image/webp'),
      url('assets/window-view.jpg')  type('image/jpeg'));
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: opacity 600ms ease-out, filter 600ms ease-out, transform 200ms ease-out;
    will-change: transform;
  }
  /* On data-heavy views, recede the photo so tables stay readable */
  .sz-dim .sz-skyline-photo { opacity: 0.82; filter: saturate(0.92); }
  .sz-dim .sz-glass {
    background: linear-gradient(180deg, rgba(8,12,22,0.12) 0%, rgba(6,10,20,0.24) 100%);
  }

  /* ========== Rained-on-glass layer ========== */
  /* Background ambient clouds — rainy night sky.
     Cool steel-blue + teal dominant; violet kept to the edges as accent.
     This is what the wet glass refracts. */
  .sz-glass-behind {
    position: fixed; inset: -10%; pointer-events: none; z-index: 0;
    background:
      /* steel-blue cloud, upper left — main mass */
      radial-gradient(700px 600px at 18% 12%, rgba(96,140,180,0.32), transparent 62%),
      /* teal-cyan cool light, upper right */
      radial-gradient(800px 650px at 88% 28%, rgba(80,150,180,0.28), transparent 65%),
      /* deep slate-blue lower mid */
      radial-gradient(600px 550px at 38% 82%, rgba(70,110,160,0.30), transparent 65%),
      /* violet bleed — pushed all the way to the corner as accent only */
      radial-gradient(360px 360px at 98% 98%, rgba(167,139,250,0.18), transparent 60%),
      /* small violet glow upper-left edge */
      radial-gradient(280px 280px at 2% 4%, rgba(139,92,246,0.14), transparent 60%);
    filter: blur(40px);
    animation: sz-drift 42s ease-in-out infinite alternate;
  }
  @keyframes sz-drift {
    0%   { transform: translate3d(-2%, -1%, 0) scale(1.02); }
    50%  { transform: translate3d(2%, 1%, 0) scale(1.05); }
    100% { transform: translate3d(-1%, 2%, 0) scale(1.02); }
  }

  /* The glass pane — light wash on hero so the city photo shows clearly. */
  .sz-glass {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background:
      linear-gradient(180deg, rgba(8,12,22,0.08) 0%, rgba(6,10,20,0.22) 100%);
    box-shadow: inset 0 0 200px rgba(8,14,26,0.35);
    transition: background 600ms ease-out;
  }

  /* Droplet layer sits on top of glass, with its own refraction filter */
  .sz-droplets {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    width: 100%; height: 100%;
    /* droplets are rendered with an SVG filter that makes them feel wet */
    mix-blend-mode: screen;
  }

  /* Trickle streaks — water running down the glass.
     Silver-cyan only; no magenta. Fades out before the lower portion of the screen. */
  .sz-trickle-wrap {
    position: fixed; top: 0; pointer-events: none; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    animation: sz-drip cubic-bezier(0.32, 0, 0.67, 0) infinite;
    opacity: 0;
  }
  .sz-trickle-streak {
    background: linear-gradient(180deg,
      transparent 0%,
      rgba(190,210,225,0.12) 15%,
      rgba(180,205,222,0.20) 60%,
      rgba(195,215,230,0.26) 85%,
      transparent 100%);
    border-radius: var(--r-1);
    filter: blur(0.5px);
  }
  @keyframes sz-drip {
    0%   { transform: translateY(-100px); opacity: 0; }
    8%   { opacity: 1; }
    62%  { opacity: 1; }
    100% { transform: translateY(65vh); opacity: 0; }
  }

  .sz-cursor-glow {
    position: fixed; top: 0; left: 0; width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(167,139,250,0.2), transparent 60%);
    pointer-events: none; z-index: 3; transition: transform 80ms linear;
    mix-blend-mode: screen;
  }

  /* Respect reduced motion — drop ambient + looping animations and the
     cursor-tracking glow. Hover transitions (user-initiated) are kept. */
  @media (prefers-reduced-motion: reduce) {
    .sz-glass-behind, .sz-trickle-wrap { animation: none; }
    .sz-cursor, .pf-dot { animation: none; }
    .sz-cursor-glow { display: none; }
    .sz-view-in { animation: none; }
  }

  .sz-stage {
    position: relative; z-index: 4;
    max-width: 1080px; margin: 0 auto; padding: 24px 48px 96px;
  }

  /* View change. Hash routing swapped the whole page in a single frame, which
     read as a reload rather than a change of screen. Keyed on the view name in
     App.jsx so it replays on every route change. */
  .sz-view-in {
    animation: sz-view-in var(--dur-base) var(--ease-out);
  }
  @keyframes sz-view-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }

  /* ========== Nav ========== */
  /* Wraps at every width, not just at the phone breakpoint below, where the
     items are ordered onto their own row. Now that the unit switch shares the
     row, a narrow desktop can run out of room, and an unwrapped flex row
     resolves that by crushing its one shrinkable item — the note beside the
     switch, which is the part carrying the meaning. Wrapping drops the switch
     to its own row instead. */
  .sz-nav {
    display: flex; align-items: center; gap: 28px;
    flex-wrap: wrap; row-gap: 10px;
    padding: 14px 20px; margin-bottom: 80px;
    background: rgba(10,6,18,0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--ink-4);
    border-radius: var(--r-1);
    font-family: var(--font-mono); font-size: 13px;
    position: sticky; top: 16px; z-index: 10;
    transition: background var(--dur-base) var(--ease-out),
                border-color var(--dur-base) var(--ease-out),
                box-shadow var(--dur-base) var(--ease-out);
  }
  /* Once it detaches from the top it is floating over table rows rather than
     over the hero, and at 0.6 alpha the rows read straight through it. */
  .sz-nav.sz-nav-stuck {
    background: rgba(10,6,18,0.82);
    border-color: rgba(167,139,250,0.30);
    box-shadow: 0 10px 30px -12px rgba(0,0,0,0.95);
  }
  /* An <a> now, so the global link rules apply to it: the brand would otherwise
     inherit --link and go magenta on hover. It keeps the flat look it had as a
     button — the wordmark is not a link you follow, it is where you already are. */
  .sz-brand {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-mono); font-size: 15px; font-weight: 500;
    color: var(--fg-1); background: transparent; border: 0; cursor: pointer;
    padding: 0; letter-spacing: -0.01em;
  }
  .sz-brand:hover { color: var(--fg-1); }
  .sz-nav-items { display: flex; gap: 20px; margin-left: 20px; flex: 1; }
  .sz-nav-item {
    background: transparent; border: 0; cursor: pointer;
    font-family: var(--font-mono); font-size: 13px;
    color: var(--fg-2); padding: 4px 0;
    transition: color 120ms var(--ease-out);
  }
  .sz-nav-item:hover { color: var(--violet-400); }
  .sz-nav-item.active { color: var(--fg-1); }
  .sz-nav-arrow { color: var(--violet-400); }
  /* $ / % switch, published into the nav by whichever view owns one. It sits
     here rather than in that view's head because it governs the headline, the
     stat row and every chart below them — all of which outrun the fold, while
     the nav is sticky. An optional note rides beside it — see UnitBar.
     margin-left:auto is a no-op on desktop, where .sz-nav-items already eats
     the slack; it does the work once the nav wraps and the items drop away to
     their own row. */
  .sz-nav-unit {
    display: flex; align-items: center; gap: 10px;
    margin-left: auto; min-width: 0; flex: none;
  }
  /* Budget: the nav gives this note about 210px at 1280, which is ~28 mono
     characters. Notes are written to that — the ellipsis is a floor, not the
     plan, and if it engages the note is too long to be doing its job. */
  .sz-nav-unit-note {
    color: var(--fg-4); font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Whatever the note gives up, the buttons keep. */
  .sz-nav-unit .pf-unit { flex: none; }

  /* ========== Cursor ========== */
  .sz-cursor {
    color: var(--violet-400);
    animation: sz-blink 1s steps(1, end) infinite;
    display: inline-block;
    margin-left: 2px;
  }
  /* On hero, the cursor inherits the soft text color so it doesn't
     fight the muted background photo. */
  .sz-hero .sz-cursor { color: var(--fg-hero); }
  @keyframes sz-blink { 50% { opacity: 0; } }

  /* ========== Shared primitives ========== */
  .sz-kicker {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--violet-300); margin-bottom: 24px;
  }
  .sz-h2 {
    font-family: var(--font-display); font-size: 44px; font-weight: 500;
    color: var(--fg-1); letter-spacing: -0.02em; line-height: 1.05;
    margin: 0 0 32px; max-width: 760px;
  }
  .sz-h3 {
    font-family: var(--font-mono); font-size: 17px; font-weight: 500;
    color: var(--fg-1); margin: 40px 0 16px; letter-spacing: -0.01em;
  }
  .sz-dim { color: var(--fg-3); }
  .sz-sep { color: var(--fg-dim); margin: 0 6px; }
  .sz-meta {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--fg-3); margin-top: 32px;
  }

  /* ========== Surfaces ==========
     One glass recipe, previously written out four times (.sz-prose, .pf-head,
     .pf-stat, .pf-panel) with identical values — so every panel sat at exactly
     the same depth and the stack read as flat rectangles rather than panes.
     The selector list keeps the existing class names working; the rules below
     now only carry their own layout.
     The inset top line is the specular: real glass catches light along its top
     edge, and it is what makes these read as panes. Keep it subtle — at higher
     alpha it turns into a drawn border and the illusion goes. */
  .sz-surface,
  .sz-prose,
  .pf-head,
  .pf-stat,
  .pf-panel {
    background: rgba(10,6,18,0.45);
    backdrop-filter: blur(20px) saturate(120%);
    -webkit-backdrop-filter: blur(20px) saturate(120%);
    border: 1px solid rgba(167,139,250,0.14);
    border-top-color: rgba(214,199,255,0.22);
    border-radius: var(--r-1);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.07),
      0 8px 24px -14px rgba(0,0,0,0.9);
  }

  /* Data views knock the photo back on purpose (.sz-dim .sz-skyline-photo), but
     the surfaces above sample that backdrop and put the color straight back:
     0.92 x 1.2 = 1.10, more saturated inside a pane than one pixel outside it.
     At 0.45 alpha that reads through. The skyline in window-view.jpg is lit
     windows and signage — long thin horizontal bands of red — so what surfaced
     on the book view was a red line lying across a chart with no visible source
     anywhere around it. Match the dim rather than fight it: 0.92 x 0.85 = 0.78
     leaves the pane recessed from the photo it sits on, which is what glass
     over a dimmed view should do. The hero keeps the 120% it was tuned for.

     brightness() is the part that makes the numbers readable. These panes are
     45% opaque, so 55% of whatever is behind them lands in the text's
     background — and behind them is a night skyline whose bright patches (the
     lit tower, the signage bands) are nowhere near the --ink-1 the type ladder
     was measured against. --fg-4 is documented at 4.8:1 on --ink-1; over a lit
     patch of photo the same swatch was measuring closer to 2.5:1, which is why
     the stat kickers washed out on exactly the cards the skyline sat behind and
     nowhere else. Raising the alpha would fix it by deleting the view, which is
     the one thing these panes exist for. Dimming the backdrop instead keeps the
     city legible through the glass and puts the type back on the surface the
     ladder assumes: ~4.5:1 in the worst case, ~5.2:1 over ordinary sky. */
  .sz-dim .sz-surface,
  .sz-dim .sz-prose,
  .sz-dim .pf-head,
  .sz-dim .pf-stat,
  .sz-dim .pf-panel {
    backdrop-filter: blur(20px) saturate(85%) brightness(0.45);
    -webkit-backdrop-filter: blur(20px) saturate(85%) brightness(0.45);
  }

  /* The page header sits nearest the viewer — a touch more opaque, lit a
     little harder, dropping a longer shadow. The only depth step on the page;
     more than one and the hierarchy stops meaning anything. */
  .sz-surface-raised,
  .pf-head {
    background: rgba(18,12,31,0.55);
    border-color: rgba(167,139,250,0.20);
    border-top-color: rgba(214,199,255,0.28);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.09),
      0 14px 34px -16px rgba(0,0,0,0.95);
  }

  /* ========== Buttons ========== */
  .sz-btn {
    font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.06em;
    padding: 10px 18px; border-radius: var(--r-1); cursor: pointer;
    border: 1px solid var(--ink-4); background: transparent; color: var(--fg-1);
    transition: all 160ms var(--ease-out);
  }
  .sz-btn:hover { border-color: var(--violet-400); color: var(--violet-300); }
  .sz-btn:active { transform: scale(0.98); }
  .sz-btn-primary {
    background: var(--violet-400); color: var(--ink-0);
    border-color: var(--violet-400); font-weight: 500;
  }
  .sz-btn-primary:hover {
    background: var(--violet-400); border-color: var(--violet-400);
    color: var(--ink-0); box-shadow: 0 0 24px rgba(167,139,250,0.4);
  }

  /* ========== Hero ========== */
  /* Hero + About sit directly over the city photo (no panel),
     so all text shifts to a very light violet for soft clarity. */
  .sz-hero, .sz-prose {
    color: var(--fg-hero);
  }
  .sz-hero .sz-hero-meta,
  .sz-hero .sz-hero-tag,
  .sz-hero .sz-hero-sub,
  .sz-hero .sz-hero-footer,
  .sz-hero .sz-hero-footer .sz-sep,
  .sz-prose .sz-kicker,
  .sz-prose p,
  .sz-prose .sz-h2,
  .sz-prose .sz-h3,
  .sz-prose .sz-meta,
  .sz-prose .sz-links a {
    color: var(--fg-hero);
  }
  .sz-prose .sz-links a:hover { color: var(--fg-hero); border-bottom-color: var(--fg-hero); }
  .sz-prose code {
    color: var(--fg-hero);
    background: rgba(0,0,0,0.35);
    border-color: rgba(236,230,245,0.18);
  }
  /* Interaction is violet. This used to be done by remapping --magenta-* to
     violet on .sz-chrome, which silently turned nine rules into no-ops while
     four hardcoded #ff4fd8 values slipped past the remap and stayed pink — so
     pink survived on the page, just unpredictably. The remap is gone and those
     rules now say violet outright. Pink lives only in --mark-* (drawn P&L), so
     a pink pixel always means data, never "you can click this". */
  .sz-chrome {
    --link-hover: var(--violet-300);
    --selection-bg: var(--violet-400);
  }
  /* ========== Writing ========== */
  /* The archive is the hero's log without the cut at three: same .sz-log-entry
     rows, no glass card under them. A list of its own would have meant two type
     scales for one stream — post rows in 18/13 and notes in 16 — since half the
     rows here are notes rather than links to a post. */
  .sz-stream { margin: 32px 0 0; }
  .sz-post-back {
    display: inline-block; font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--fg-3); text-decoration: none; margin-bottom: 24px;
  }
  .sz-post-back:hover { color: var(--violet-300); }
  .sz-post-body { line-height: 1.75; }
  .sz-post-body p { margin: 0 0 18px; color: var(--fg-hero); }
  .sz-post-body h1, .sz-post-body h2, .sz-post-body h3 {
    color: var(--fg-hero); letter-spacing: -0.01em; margin: 36px 0 12px;
  }
  .sz-post-body a { color: var(--violet-300); }
  .sz-post-body blockquote {
    margin: 0 0 18px; padding: 2px 0 2px 16px;
    border-left: 2px solid var(--violet-400); color: var(--fg-2);
  }
  .sz-post-body code {
    font-family: var(--font-mono); font-size: 0.9em;
    background: rgba(0,0,0,0.35); padding: 1px 5px; border-radius: var(--r-1);
  }
  .sz-post-body pre { background: rgba(0,0,0,0.35); padding: 14px; border-radius: var(--r-1); overflow-x: auto; }
  .sz-post-body pre code { background: none; padding: 0; }

  .sz-hero { padding: 40px 0 60px; }
  .sz-hero-meta {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--fg-3); margin-bottom: 24px;
  }
  .sz-hero-name {
    font-family: var(--font-display); font-size: clamp(48px, 11vw, 120px); font-weight: 500;
    color: var(--fg-1); letter-spacing: -0.04em; line-height: 0.95;
    margin: 0; white-space: normal; overflow-wrap: break-word;
  }
  .sz-hero-tag {
    font-family: var(--font-display); font-size: clamp(22px, 5vw, 32px); font-weight: 300;
    color: var(--fg-2); letter-spacing: -0.02em; line-height: 1.15;
    margin: 28px 0 12px; max-width: 780px; min-height: 40px;
  }
  .sz-hero-sub {
    font-family: var(--font-sans); font-size: 17px;
    color: var(--fg-3); max-width: 560px; margin: 0 0 36px;
  }
  .sz-hero-footer {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--fg-3); letter-spacing: 0.04em;
    display: flex; flex-wrap: wrap; gap: 2px;
    padding-top: 24px; border-top: 1px solid var(--border-soft);
  }

  /* ========== Prose / About ========== */
  .sz-prose {
    max-width: 680px;
    padding: 32px 36px;
  }
  .sz-prose p {
    font-family: var(--font-sans); font-size: 17px; line-height: 1.7;
    color: var(--fg-2); margin: 0 0 20px; font-weight: 300;
  }
  .sz-links {
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 8px;
    font-family: var(--font-mono); font-size: 13px;
  }
  .sz-links a { color: var(--fg-2); }
  .sz-links a:hover { color: var(--violet-400); }

  /* ========== Log / Hero ========== */
  .sz-log {
    margin-top: 64px;
    margin-bottom: 64px;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    gap: 0;
    background: rgba(10,6,18,0.55);
    backdrop-filter: blur(16px) saturate(120%);
    -webkit-backdrop-filter: blur(16px) saturate(120%);
    border: 1px solid var(--ink-4);
    border-radius: var(--r-1);
    padding: 32px 36px;
  }
  .sz-log-entry {
    display: grid; grid-template-columns: 110px 1fr; gap: 24px;
    padding: 28px 0;
    border-bottom: 1px solid rgba(236,230,245,0.08);
  }
  .sz-log-entry:first-child { padding-top: 0; }
  .sz-log-entry:last-child { padding-bottom: 0; border-bottom: none; }
  /* Rows that carry a post are the whole row a link, so the title and the body
     under it are one target. The body keeps its own color — only the title
     moves on hover, which is what says "this one continues". */
  a.sz-log-entry { text-decoration: none; color: inherit; }
  .sz-log-title {
    font-family: var(--font-sans); font-size: 18px; font-weight: 500;
    color: var(--fg-hero); letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  a.sz-log-entry:hover .sz-log-title { color: var(--violet-300); }
  .sz-log-date {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.1em; color: rgba(236,230,245,0.45);
    padding-top: 3px;
  }
  .sz-log-body {
    font-family: var(--font-sans); font-size: 16px;
    line-height: 1.7; color: var(--fg-hero);
    margin: 0; font-weight: 300;
  }
  .sz-log-body a {
    color: var(--violet-300);
    text-decoration: none;
    border-bottom: 1px solid rgba(167,139,250,0.4);
  }
  .sz-log-body a:hover { border-bottom-color: var(--violet-300); }
  /* The last entry above this keeps its border — the rule reads as the bottom
     of the log rather than a divider between two entries. */
  .sz-log-more {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--fg-3); text-decoration: none;
    padding-top: 24px;
  }
  .sz-log-more:hover { color: var(--violet-300); }

  .sz-rss {
    margin-top: 32px; padding: 16px 0;
    font-family: var(--font-mono); font-size: 12px;
    color: var(--fg-3); display: flex; gap: 10px; align-items: center;
    letter-spacing: 0.06em;
  }
  .sz-rss a { color: var(--violet-300); }

  /* ========== Portfolio ========== */
  .pf-wrap { max-width: 1080px; }
  .pf-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 40px; margin-bottom: 16px; flex-wrap: wrap;
    padding: 20px 22px;
  }
  .pf-head .sz-h2 { margin-bottom: 8px; }
  .pf-currency {
    font-family: var(--font-mono); font-size: 13px;
    color: var(--fg-3); margin-left: 12px;
    letter-spacing: 0.14em; text-transform: uppercase;
    vertical-align: middle;
  }
  .pf-sub {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--fg-3); letter-spacing: 0.04em;
    display: flex; flex-wrap: wrap; gap: 2px;
  }
  .pf-updated {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 11px;
    color: var(--fg-3); letter-spacing: 0.1em; text-transform: uppercase;
    padding: 8px 14px; border: 1px solid var(--ink-4); border-radius: var(--r-pill);
    background: rgba(10,6,18,0.6);
    white-space: nowrap;
  }
  .pf-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--pos); box-shadow: 0 0 8px rgba(125,211,168,0.6);
    animation: sz-blink 2s ease-in-out infinite;
  }

  .pf-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 32px;
  }
  .pf-stat {
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .pf-stat-label {
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--fg-3);
  }
  .pf-stat-value {
    font-family: var(--font-display); font-size: 30px; font-weight: 400;
    color: var(--fg-1); letter-spacing: -0.02em; line-height: 1.1;
  }
  .pf-stat-chg {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em;
  }
  .pf-stat-chg.pos { color: var(--pos); }
  .pf-stat-chg.neg { color: var(--neg); }
  .pf-stat-kicker {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--fg-4); letter-spacing: 0.1em;
  }
  /* second stat row (risk metrics) sits tight under the P&L row */
  .pf-stats-risk { margin-top: -18px; }
  /* Five across once Sortino sits next to Sharpe. The value size comes down a
     notch and the kicker's tracking tightens so "downside dev 11.2%" still
     fits one line at a fifth of the width — the same trade .cmb-risk-grid-5
     makes for the same reason. */
  .pf-stats-5 { grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .pf-stats-5 .pf-stat { padding: 16px 14px; }
  .pf-stats-5 .pf-stat-value { font-size: 26px; }
  .pf-stats-5 .pf-stat-kicker { letter-spacing: 0.06em; }
  /* Cramped well before the 640px two-column rule takes over, so drop to three
     in between. Below 640 the shared .pf-stats query wins on source order. */
  @media (max-width: 900px) {
    .pf-stats-5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  .pf-strip-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 16px; margin-bottom: 2px;
  }
  .pf-strip-label {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--fg-4); letter-spacing: 0.14em; text-transform: uppercase;
  }
  .pf-strip-meta {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--fg-4); letter-spacing: 0.1em;
  }
  /* rolling-metric strip: the beta/vol/corr switch sits inline with the readout */
  .pf-strip-toggle { display: flex; align-items: center; gap: 12px; }

  /* moments under the return histogram — the numbers a Sharpe ratio hides */
  .pf-dist-stats {
    display: flex; flex-wrap: wrap; gap: 6px 22px;
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--border-soft);
    font-family: var(--font-mono); font-size: 10px;
    color: var(--fg-4); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .pf-dist-stats b {
    color: var(--fg-2); font-weight: 500;
    font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
  }

  /* capture tiles sit flush inside their panel — the panel head is the title */
  .pf-stats-capture { margin-bottom: 0; }

  /* a drawdown still underwater has no recovery date to print */
  .pf-dd-open {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--neg);
  }
  /* range selector (1M / 3M / 6M / YTD / 1Y) */
  /* wraps because seven buttons plus the history picker overflow a phone-width
     panel head; the parent only ever wrapped the selector as one block */
  .pf-range { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
  /* panel heads that carry a caption AND a range selector: keep both on the
     right edge together rather than letting space-between strand the caption
     in the middle of the head */
  .pf-panel-head-right {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px;
  }
  .pf-head-right {
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  @media (max-width: 480px) {
    .pf-updated-fetch { display: none; }
  }
  /* The same switch sitting inside a panel head's range strip, where it governs
     that one panel — polymarket's cumulative-pnl chart, the only one still
     scoped that narrowly. The rule separates it from the range buttons so it
     doesn't read as an eighth timeframe. The page-wide switches on ibkr and
     book draw in the nav instead; see .sz-nav-unit. */
  .pf-range-unit {
    display: inline-flex; margin-left: 8px; padding-left: 10px;
    border-left: 1px solid var(--border-soft);
  }
  .pf-unit { display: inline-flex; gap: 4px; }
  .pf-unit .pf-range-btn { min-width: 28px; }
  .pf-range-btn {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--fg-4);
    background: transparent; border: 1px solid var(--border-soft);
    border-radius: var(--r-1); padding: 3px 8px; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .pf-range-btn:hover { color: var(--fg-2); border-color: rgba(167,139,250,0.35); }
  .pf-range-btn.active {
    color: var(--fg-1); border-color: rgba(167,139,250,0.55);
    background: rgba(167,139,250,0.12);
  }
  /* history picker — completed quarters, anchored under the button */
  .pf-range-history { position: relative; display: inline-flex; }
  .pf-range-caret { opacity: 0.6; font-size: 8px; }
  .pf-range-menu {
    position: absolute; top: calc(100% + 5px); right: 0; z-index: 40;
    min-width: 150px; padding: 4px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--r-1); box-shadow: 0 10px 28px rgba(0,0,0,0.55);
    display: flex; flex-direction: column; gap: 1px;
  }
  .pf-range-menu-head {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--fg-4);
    padding: 4px 8px 5px; border-bottom: 1px solid var(--border-soft); margin-bottom: 3px;
  }
  .pf-range-menu-item {
    display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--fg-3);
    background: transparent; border: 0; border-radius: var(--r-1);
    padding: 5px 8px; cursor: pointer; text-align: left;
    transition: color .15s, background .15s;
  }
  .pf-range-menu-item:hover { color: var(--fg-1); background: rgba(167,139,250,0.14); }
  .pf-range-menu-item.active { color: var(--fg-1); background: rgba(167,139,250,0.2); }
  .pf-range-menu-span { color: var(--fg-4); letter-spacing: 0.04em; text-transform: none; }
  /* benchmark picker — same menu chrome as the history picker, but multi-select,
     so it sits apart from the range buttons the way the panel-scoped unit switch
     does: these choose what the series is drawn against, not over what window */
  .pf-range-bench {
    margin-left: 8px; padding-left: 10px;
    border-left: 1px solid var(--border-soft);
  }
  .pf-bench-menu { min-width: 208px; }
  /* One head per group, so every head after the first needs air above it */
  .pf-bench-menu .pf-range-menu-head:not(:first-child) { margin-top: 7px; }
  /* The tick IS the swatch: it carries the line's color when on and an empty
     rule when off, so the menu reads as the chart's legend before you commit */
  .pf-bench-tick { display: inline-flex; align-items: center; gap: 8px; }
  /* combined-view risk panel: flat divided columns, not nested stat cards */
  .cmb-risk-grid { display: grid; grid-template-columns: repeat(4, 1fr); }
  .cmb-risk-grid .pf-stat {
    background: transparent; border: none; border-radius: 0;
    -webkit-backdrop-filter: none; backdrop-filter: none;
    box-shadow: none;   /* flat columns — no glass, so no lit edge either */
    padding: 2px 20px;
  }
  .cmb-risk-grid .pf-stat + .pf-stat { border-left: 1px solid var(--border-soft); }
  .cmb-risk-grid .pf-stat:first-child { padding-left: 0; }
  /* Five columns for the base row, six once the correlation tile joins. Tighter
     padding and a smaller value size keep "−0.00" and its longer kicker on one
     line at these widths. */
  .cmb-risk-grid-5 { grid-template-columns: repeat(5, 1fr); }
  .cmb-risk-grid-5 .pf-stat { padding: 2px 14px; }
  .cmb-risk-grid-5 .pf-stat-value { font-size: 26px; }
  .cmb-risk-grid-6 { grid-template-columns: repeat(6, 1fr); }
  .cmb-risk-grid-6 .pf-stat { padding: 2px 12px; }
  .cmb-risk-grid-6 .pf-stat-value { font-size: 24px; }
  .cmb-risk-grid-5 .pf-stat-kicker,
  .cmb-risk-grid-6 .pf-stat-kicker { letter-spacing: 0.06em; }
  /* Five or six across gets cramped before the 640px two-column rule takes
     over, so drop to three in between. Below 640 the shared .cmb-risk-grid
     query wins. */
  @media (max-width: 900px) {
    .cmb-risk-grid-5,
    .cmb-risk-grid-6 { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 18px; }
    .cmb-risk-grid-5 .pf-stat:nth-child(3n+1),
    .cmb-risk-grid-6 .pf-stat:nth-child(3n+1) { padding-left: 0; border-left: none; }
  }

  .pf-panel {
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  /* Column gap keeps the title and the meta apart in a narrow panel (the
     allocation column is half-width, where "share of gross exposure" would
     otherwise butt straight into the title); wrapping drops the meta onto its
     own line rather than letting the two collide. */
  .pf-panel-head {
    display: flex; justify-content: space-between; align-items: baseline;
    flex-wrap: wrap; gap: 4px 20px;
    margin-bottom: 16px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border-soft);
  }
  .pf-panel-title {
    font-family: var(--font-mono); font-size: 13px; font-weight: 500;
    color: var(--fg-1); letter-spacing: 0.02em;
  }
  .pf-panel-meta {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--fg-4); letter-spacing: 0.14em; text-transform: uppercase;
  }
  .pf-navchart { width: 100%; height: auto; display: block; }

  /* contribution-to-return diverging bars */
  /* Rows are flush, not spaced: the bars stack edge to edge so the panel reads
     as one diverging chart instead of a list of marks floating on their own
     lines. No gap on the column, and a track that stretches to the full row box
     rather than sitting centered inside it.
     The row pitch MUST stay an even, 4-divisible number of CSS pixels. Adjacent
     borders are collapsed by over-extending the bar (see .pf-contrib-bar), not
     by a negative row margin — a -1px margin made the pitch 19px, which is
     fractional in device pixels at both common Windows display scalings
     (19 x 1.25 = 23.75, 19 x 1.5 = 28.5). Every row then landed on a different
     subpixel phase, so half the 1px borders antialiased across two device rows
     at half strength and the bars looked like they were different heights.
     At 20px: 25 and 30 device px, integral, every row identical. */
  .pf-contrib { display: flex; flex-direction: column; }
  .pf-contrib-row {
    display: grid; grid-template-columns: 64px 1fr 96px;
    align-items: center; gap: 12px;
    height: 20px;
  }
  .pf-contrib-sym {
    font-family: var(--font-mono); font-size: 12px; color: var(--fg-2);
    letter-spacing: 0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pf-contrib-track { position: relative; align-self: stretch; }
  /* Bleeds 1px past the track top and bottom so the dividers on stacked rows
     join into one continuous zero line down the panel. */
  .pf-contrib-center {
    position: absolute; left: 50%; top: -1px; bottom: -1px;
    width: 1px; background: rgba(229,225,241,0.18);
  }
  /* Hollow outlined bars: 1px stroke over the wash, square corners — the same
     skin as the monthly-pnl columns and the return histogram. No radius, since
     a radius on a short bar is most of the bar (that's what made the old
     monthly capsules read as extruded gel). box-sizing keeps a 1px-wide bar
     from doubling into a 2px blob once it has borders. */
  /* Runs 1px past the bottom of its track so its bottom border lands exactly on
     the next row's top border and the two collapse into a single hairline. Doing
     it here instead of with a negative row margin keeps the row pitch a whole
     20px — see the note on .pf-contrib-row. */
  .pf-contrib-bar {
    position: absolute; top: 0; height: calc(100% + 1px); min-width: 1px;
    box-sizing: border-box; border: 1px solid; border-radius: 0;
  }
  .pf-contrib-bar.pos { background: var(--mark-pos-wash); border-color: var(--mark-pos); }
  .pf-contrib-bar.neg { background: var(--mark-neg-wash); border-color: var(--mark-neg); }
  /* The unrealized continuation of a bar: same stroke, same hue, carried at
     lower opacity. Booked money and marked money are different kinds of claim
     and the bar has to say so — but with weight, not with a second colour and
     not with a dash, which would read as a boundary rather than as a softer
     version of the same quantity. */
  .pf-contrib-bar.mark { opacity: 0.45; }
  .pf-contrib-val {
    font-family: var(--font-mono); font-size: 11px; text-align: right; letter-spacing: 0.02em;
  }
  .pf-contrib-val.pos { color: var(--pos); }
  .pf-contrib-val.neg { color: var(--neg); }
  .pf-contrib-foot {
    display: flex; justify-content: space-between;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-soft);
    font-family: var(--font-mono); font-size: 10px;
    color: var(--fg-4); letter-spacing: 0.1em;
  }

  .pf-row {
    display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px;
    margin-bottom: 16px;
  }
  /* Without this the positions panel is sized by the table's min-content — a
     grid item's auto floor — so .pf-table-wrap grew to 482px inside a 339px
     column, its overflow-x:auto never engaged, and the table ran off the page
     to be clipped by body{overflow-x:hidden}. Zero the floor and the wrapper
     scrolls internally the way it was always meant to. */
  .pf-row > * { min-width: 0; }
  .pf-panel-alloc, .pf-panel-pos { margin-bottom: 0; }
  .pf-alloc { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .pf-donut { width: 160px; height: 160px; }
  .pf-legend {
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 6px; width: 100%;
    font-family: var(--font-mono); font-size: 11px;
  }
  .pf-legend li {
    display: grid; grid-template-columns: 10px 1fr auto;
    gap: 10px; align-items: center;
  }
  .pf-legend-dot { width: 8px; height: 8px; border-radius: 1px; }
  .pf-legend-label { color: var(--fg-2); letter-spacing: 0.02em; }
  .pf-legend-pct { color: var(--fg-3); font-variant-numeric: tabular-nums; }
  /* Net-short bucket: the ring slice is hatched, this repeats it in words so
     direction never rests on the fill alone. */
  .pf-legend-short {
    margin-left: 6px; padding: 1px 4px; border-radius: var(--r-1);
    font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--fg-3); border: 1px solid var(--border);
  }
  /* A rate future's size is rate risk at a stated shock, not market value. The
     arithmetic is in the hover; a faint solid underline says there is one. */
  .pf-risk-val {
    cursor: help;
    text-decoration: underline solid rgba(229,225,241,0.25);
    text-underline-offset: 3px;
  }

  /* attribution-by-market-type (polymarket) + by-instrument-type (portfolio):
     shared bar treatment. Category/asset-class names are longer than tickers, so
     the label column is 118px (fits "futures options"/"event contracts") vs the
     64px .pf-contrib-row default. */
  /* position:relative so the hover box positions and clamps against this list
     rather than escaping to the panel. */
  .pm-cat-bars { position: relative; }
  .pm-cat-bars .pf-contrib-row { grid-template-columns: 118px 1fr 96px; }
  .pm-cat-bars .pf-contrib-sym { text-transform: lowercase; }
  .pm-cat-table-wrap { margin-top: 18px; padding-top: 4px; border-top: 1px solid var(--border-soft); }
  /* Under-sampled rows stay visible but read as provisional. */
  .pm-cat-thin, .pm-cat-thin-row td { opacity: 0.45; }
  /* top-1 is a reference-context column, not a headline metric — muted so the
     eye lands on edge/pos and roi first. */
  .pm-cat-top1 { color: var(--fg-4); }
  /* The open-book columns report NOW while everything around them can be
     windowed, so they are set back a step: present for the reader who is asking
     what is still riding, not competing with the scored columns beside them.
     `unreal` keeps its pos/neg colour when there is something open — a live
     mark is the one figure here a reader will want to find at a glance. */
  .pm-cat-open { color: var(--fg-4); }
  /* Scope banding over the column names. Set smaller and dimmer than the names
     beneath, since it labels them rather than competing with them, and the rule
     runs only under the spans — the ungrouped `type` and `book` columns get no
     underline, which is what tells you they sit outside both groups. */
  .pf-table-group th {
    padding-bottom: 3px; font-size: 9px; letter-spacing: 0.16em;
    color: var(--fg-4); opacity: 0.75; border-bottom: none;
  }
  .pf-table-group th[colspan] {
    border-bottom: 1px solid rgba(167,139,250,0.22);
  }
  /* The row's total, and the one column that always equals the bar beside it. */
  .pm-cat-book { font-weight: 500; }
  /* Scope note — what the bars leave out. Borrows .pf-contrib-foot's type scale
     but drops its rule: the table above already ends on a border, and two hairlines
     14px apart read as a broken cell rather than a divider. */
  .pm-cat-scope { margin-top: 14px; padding-top: 0; border-top: none; }
  .pm-cat-scope b { font-weight: 500; }
  .pm-cat-scope b.pos { color: var(--pos); }
  .pm-cat-scope b.neg { color: var(--neg); }

  @media (max-width: 640px) {
    /* Reclaim track width on phones; labels shrink rather than the bars. */
    .pm-cat-bars .pf-contrib-row { grid-template-columns: 84px 1fr 76px; gap: 8px; }
    .pm-cat-bars .pf-contrib-sym { font-size: 11px; }
  }

  .pf-table-wrap { overflow-x: auto; }
  .pf-table {
    width: 100%; border-collapse: collapse;
    font-family: var(--font-mono); font-size: 12px;
  }
  .pf-table th {
    text-align: left; padding: 8px 10px 10px;
    color: var(--fg-4); letter-spacing: 0.12em; text-transform: uppercase;
    font-size: 10px; font-weight: 400;
    border-bottom: 1px solid var(--border-soft);
  }
  .pf-table td {
    padding: 10px; border-bottom: 1px solid rgba(167,139,250,0.05);
    color: var(--fg-2);
  }
  .pf-table tr:hover td { background: rgba(167,139,250,0.04); }
  /* Benchmark comparison: every row is the picker's toggle for that index, so
     the rows carry the affordance the rest of the table's rows don't. The lit
     state is the left edge rather than a fill — a filled row in a table of
     numbers reads as "this figure is special", and what is actually true is
     "this line is drawn above". */
  .pf-bench-row { cursor: pointer; }
  .pf-bench-row td:first-child { box-shadow: inset 2px 0 0 transparent; }
  .pf-bench-row.on td:first-child { box-shadow: inset 2px 0 0 var(--violet-400); }
  .pf-bench-row:focus-visible {
    outline: 1px solid var(--violet-300); outline-offset: -1px;
  }
  .pf-bench-table .pf-sym { display: flex; align-items: center; gap: 7px; }
  /* Reserved whether or not the arrow is there, so ticking a different index
     doesn't shuffle the column sideways. */
  .pf-bench-arrow {
    display: inline-block; width: 9px; color: var(--violet-300); font-size: 10px;
  }
  .pf-table .pf-num { text-align: right; font-variant-numeric: tabular-nums; }
  .pf-table .pf-sym { color: var(--fg-1); font-weight: 500; }
  .pf-table .pf-name { color: var(--fg-3); font-family: var(--font-sans); font-size: 13px; }
  .pf-table .pos { color: var(--pos); }
  .pf-table .neg { color: var(--neg); }
  .pf-type-badge {
    display: inline-block;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;
    padding: 2px 6px; border-radius: var(--r-1);
    border: 1px solid rgba(167,139,250,0.35);
    color: rgba(167,139,250,0.85);
    white-space: nowrap;
  }
  .pf-type-badge:is([data-type="call"], [data-type="fut·call"]) { border-color: rgba(255,154,232,0.4); color: rgba(255,154,232,0.9); }
  .pf-type-badge:is([data-type="put"], [data-type="fut·put"])   { border-color: rgba(255,79,216,0.4);  color: rgba(255,79,216,0.9); }
  .pf-type-badge[data-type="crypto"] { border-color: rgba(255,79,216,0.35); color: rgba(255,154,232,0.85); }
  .pf-type-badge[data-type="ETF"]    { border-color: rgba(196,181,253,0.4); color: rgba(196,181,253,0.9); }
  .pf-type-badge[data-type="ADR"]    { border-color: rgba(196,181,253,0.35); color: rgba(196,181,253,0.85); }

  /* Everything else on these views sits on a pane; this note did not, so it was
     11px of --fg-4 laid straight over the skyline. Where the photo went bright
     behind it the line simply stopped being readable — worst on a phone, where
     it wraps across the widest part of the view. It gets the same glass as the
     panels it introduces rather than a color bump, because the problem was the
     backdrop, not the swatch. */
  .pf-footer {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--fg-3); letter-spacing: 0.06em;
    margin-top: 32px; padding: 10px 14px;
    background: rgba(10,6,18,0.45);
    backdrop-filter: blur(20px) saturate(85%) brightness(0.45);
    -webkit-backdrop-filter: blur(20px) saturate(85%) brightness(0.45);
    border: 1px solid rgba(167,139,250,0.14);
    border-top-color: rgba(214,199,255,0.22);
    border-radius: var(--r-1);
    display: flex; flex-wrap: wrap; gap: 2px;
  }
  /* Same note, hoisted above the panels. It is a pane now, so the divider rule
     it used to carry would only double the border it already has. */
  .pf-footer.pf-note-top {
    margin-top: 0; margin-bottom: 24px;
  }

  @media (max-width: 760px) {
    /* 48px of gutter each side costs a 360px phone more than a quarter of its
       width — and the tables shrunk below were being squeezed by the container,
       not by their own type. */
    /* 12, not 18: with the panel's own padding below, the two insets together
       left a 375px phone's tables 293px to draw in. */
    .sz-stage { padding: 16px 12px 72px; }
    .pf-panel { padding: 16px 14px; }
    /* Wide content can scroll sideways; the fade says so. Only on narrow
       screens, where these actually overflow — on desktop it would dim a
       column edge for no reason. */
    .pf-table-wrap, .pm-cat-table-wrap {
      -webkit-mask-image: linear-gradient(90deg, #000 0, #000 88%, transparent 100%);
      mask-image: linear-gradient(90deg, #000 0, #000 88%, transparent 100%);
    }
    /* A bare 1fr is minmax(auto, 1fr), and that auto floor is the min-content
       width of an unbreakable "$312,567" at 30px — so the tiles refused to
       shrink and the grid ran off the right edge of every phone. minmax(0,1fr)
       lets the track shrink; the smaller value type keeps the number inside it
       rather than just moving the clipping indoors. */
    .pf-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pf-stat { min-width: 0; }
    .pf-stat-value { font-size: 22px; }
    .cmb-risk-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 18px; }
    .cmb-risk-grid .pf-stat { padding: 2px 16px; }
    .cmb-risk-grid .pf-stat:nth-child(odd) { padding-left: 0; border-left: none; }
    .pf-row { grid-template-columns: minmax(0, 1fr); }
    .sz-nav {
      gap: 12px; padding: 10px 14px 4px; margin-bottom: 48px;
      row-gap: 2px;   /* wrapping itself is unconditional now — see above */
      transition: transform var(--dur-base) var(--ease-out),
                  background var(--dur-base) var(--ease-out),
                  border-color var(--dur-base) var(--ease-out),
                  box-shadow var(--dur-base) var(--ease-out);
    }
    /* Sticky, the nav held a sixth of a phone screen through every table. It
       steps out of the way while the reader scrolls down and returns the
       moment they scroll up. Nav.jsx sets the class at every width; this is
       the only rule for it. */
    .sz-nav.sz-nav-away { transform: translateY(calc(-100% - 20px)); }
    /* The items wrapped onto two rows of their own. One row that scrolls
       sideways instead, with the same edge fade the tables use to say so. */
    .sz-nav-items {
      gap: 16px; margin-left: 0; order: 3; flex-basis: 100%;
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      -webkit-mask-image: linear-gradient(90deg, #000 0, #000 85%, transparent 100%);
      mask-image: linear-gradient(90deg, #000 0, #000 85%, transparent 100%);
    }
    .sz-nav-items::-webkit-scrollbar { display: none; }
    /* Runway past the last item, so scrolled to the end it clears the fade
       instead of resting inside it. A flex child rather than padding, which not
       every engine counts toward a flex container's scroll width. */
    .sz-nav-items::after { content: ''; flex: 0 0 36px; }
    .sz-nav-item { white-space: nowrap; padding: 10px 0; }
    .sz-nav-unit { gap: 8px; }
    .pf-table { font-size: 11px; }
    .pf-table th, .pf-table td { padding: 7px 8px; }
  }
  /* Touch only, and only at phone width: the range and unit buttons drew 21px
     tall, about half a fingertip. A mouse on a narrowed desktop window keeps the
     compact size. */
  @media (max-width: 760px) and (pointer: coarse) {
    .pf-range { gap: 6px; }
    .pf-range-btn { min-height: 32px; padding: 6px 10px; }
    .pf-unit .pf-range-btn { min-width: 36px; }
    .pf-range-menu-item { padding-top: 10px; padding-bottom: 10px; }
  }

  /* ========== Polymarket view overrides ========== */
  .pm-view .pf-stat-value.pos { color: var(--pos); }
  .pm-view .pf-stat-value.neg { color: var(--neg); }
  /* Book: headline stays neutral; the component tiles carry the pos/neg color. */
  .cmb-view .pf-stat-value.pos { color: var(--pos); }
  .cmb-view .pf-stat-value.neg { color: var(--neg); }
  .pm-wallet {
    font-family: var(--font-mono); color: var(--fg-4);
    letter-spacing: 0.04em;
  }
  .pm-side {
    display: inline-block;
    font-family: var(--font-mono); font-size: 10px;
    font-weight: 500; letter-spacing: 0.14em;
    padding: 3px 8px; border-radius: var(--r-1);
    min-width: 36px; text-align: center;
  }
  .pm-side-yes {
    background: rgba(125,211,168,0.14);
    color: var(--pos);
    border: 1px solid rgba(125,211,168,0.3);
  }
  .pm-side-no {
    background: rgba(255,107,157,0.12);
    color: var(--neg);
    border: 1px solid rgba(255,107,157,0.3);
  }
  .pm-market {
    color: var(--fg-2);
    font-family: var(--font-sans); font-size: 13px;
    max-width: 280px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pm-price { color: var(--fg-1); }
  .pm-pos-table { table-layout: fixed; width: 100%; }
  .pm-pos-table th:first-child, .pm-pos-table td:first-child { width: 38%; }

  /* open positions: search + market type, above the table they narrow */
  .pm-pos-tools {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    margin-bottom: 12px;
  }
  .pm-pos-search {
    flex: 0 1 220px; min-width: 0;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
    color: var(--fg-1); background: transparent;
    border: 1px solid var(--border-soft); border-radius: var(--r-1);
    padding: 4px 8px;
    transition: border-color .15s;
  }
  .pm-pos-search::placeholder { color: var(--fg-4); }
  .pm-pos-search:hover { border-color: rgba(167,139,250,0.35); }
  .pm-pos-search:focus { outline: none; border-color: rgba(167,139,250,0.55); }
  .pm-pos-cats { justify-content: flex-start; }

  /* Sortable headers keep the header type; the button only adds the hit area.
     The caret stays drawn on the idle column, fainter, so it reads as sortable
     before anyone clicks it. */
  .pm-sort {
    font: inherit; letter-spacing: inherit; text-transform: inherit;
    color: inherit; background: transparent; border: 0; padding: 0;
    cursor: pointer; display: inline-flex; align-items: baseline; gap: 4px;
  }
  .pm-sort:hover, .pm-sort.active { color: var(--fg-2); }
  .pm-sort-caret { font-size: 8px; opacity: 0.35; }
  .pm-sort.active .pm-sort-caret { opacity: 0.9; color: var(--violet-300); }
  .pm-sort:focus-visible { outline: 1px solid var(--violet-300); outline-offset: 2px; }

  .pm-pos-empty {
    text-align: center; color: var(--fg-4);
    font-size: 11px; letter-spacing: 0.08em; padding: 18px 10px;
  }

  /* Phone layout: market, side, value, p&l. The title wraps to three lines
     instead of truncating at a third of the width, and the whole cell is the
     button that opens shares and prices underneath. */
  .pm-pos-narrow th:first-child, .pm-pos-narrow td:first-child { width: auto; }
  /* Sized to "+$69,709" and a YES pill at 11px mono, with the inner padding
     trimmed, so the title keeps as much of a 375px phone as it can. */
  .pm-pos-narrow th:not(:first-child), .pm-pos-narrow td:not(:first-child) {
    padding-left: 4px; padding-right: 4px;
  }
  .pm-pos-narrow th:nth-child(2) { width: 32px; }
  .pm-pos-narrow th:nth-child(3), .pm-pos-narrow th:nth-child(4) { width: 58px; }
  .pm-pos-narrow tr > :last-child { padding-right: 0; }
  .pm-pos-narrow tr > :first-child { padding-left: 0; }
  .pm-pos-narrow td.pm-market { max-width: none; white-space: normal; }
  .pm-pos-narrow .pm-side { min-width: 0; padding: 2px 5px; letter-spacing: 0.08em; }
  .pm-pos-expand {
    display: flex; align-items: flex-start; gap: 6px; width: 100%;
    font: inherit; color: inherit; text-align: left;
    background: transparent; border: 0; padding: 0; cursor: pointer;
  }
  .pm-pos-caret { flex: none; width: 9px; font-size: 9px; line-height: 17px; color: var(--fg-4); }
  .pm-pos-title {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
    overflow: hidden; line-height: 1.35;
  }
  .pm-pos-row.open .pm-pos-title { display: block; }
  .pm-pos-row.open td { border-bottom-color: transparent; }
  .pm-pos-narrow .pm-pos-detail td { padding-top: 0; padding-left: 15px; }
  .pm-pos-facts {
    display: flex; flex-wrap: wrap; gap: 4px 16px;
    color: var(--fg-1); font-variant-numeric: tabular-nums;
  }
  .pm-pos-detail i {
    font-style: normal; color: var(--fg-4);
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-right: 4px;
  }
  .pm-pos-detail:hover td { background: transparent; }
  @media (max-width: 640px) {
    .pm-pos-search { flex: 1 1 100%; }
  }
  /* The four-column phone table fits its panel, so the sideways-scroll fade
     the other tables wear would only dim the p&l column. */
  @media (max-width: 760px) {
    .pf-table-wrap.pm-pos-fit { -webkit-mask-image: none; mask-image: none; }
  }
  @media (max-width: 760px) and (pointer: coarse) {
    .pm-pos-search { min-height: 32px; font-size: 16px; }   /* 16px: no iOS focus zoom */
    .pm-pos-expand { min-height: 32px; }
  }

  .pm-feed {
    list-style: none; padding: 0; margin: 0;
    font-family: var(--font-mono); font-size: 12px;
    display: flex; flex-direction: column;
  }
  .pm-feed-row {
    display: grid;
    grid-template-columns: 70px 48px 46px 56px 16px 56px 1fr;
    gap: 10px; align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid rgba(167,139,250,0.05);
    color: var(--fg-2);
  }
  .pm-feed-row:hover { background: rgba(167,139,250,0.04); }
  .pm-feed-time { color: var(--fg-4); letter-spacing: 0.04em; font-size: 11px; }
  .pm-feed-type {
    text-align: center; letter-spacing: 0.14em; font-size: 10px;
    padding: 2px 6px; border-radius: var(--r-1);
  }
  .pm-feed-buy  { background: rgba(167,139,250,0.12); color: var(--violet-300); }
  .pm-feed-sell { background: rgba(167,139,250,0.1);  color: var(--violet-300); }
  .pm-feed-size { text-align: right; color: var(--fg-1); font-variant-numeric: tabular-nums; }
  .pm-feed-at   { color: var(--fg-4); text-align: center; }
  .pm-feed-price { color: var(--fg-1); font-variant-numeric: tabular-nums; }
  .pm-feed-market {
    color: var(--fg-3); font-family: var(--font-sans); font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pm-footer-deep a { color: var(--violet-300); text-decoration: none; }
  .pm-footer-deep a:hover { color: var(--violet-400); }

  /* Polymarket headline */
  .pm-headline .pos { color: var(--pos); }
  .pm-headline .neg { color: var(--neg); }

  /* Profit breakdown panel */
  .pm-breakdown-panel { margin-bottom: 16px; }
  .pm-breakdown-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 1px;
    background: rgba(167,139,250,0.08);
    border-radius: var(--r-1);
    overflow: hidden;
  }
  @media (max-width: 760px) {
    .pm-breakdown-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .pm-breakdown-cell {
    background: rgba(10,6,18,0.55);
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .pm-breakdown-label {
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--fg-4);
  }
  .pm-breakdown-val {
    font-family: var(--font-display); font-size: 22px; font-weight: 400;
    color: var(--fg-2); letter-spacing: -0.02em; line-height: 1.1;
  }
  .pm-breakdown-val.pos { color: var(--pos); }
  .pm-breakdown-val.neg { color: var(--neg); }
  .pm-breakdown-src {
    color: var(--violet-300); text-decoration: none;
  }
  .pm-breakdown-src:hover { color: var(--violet-400); }

  /* Polymarket sparkline tooltip */
  .pm-chart-wrap { position: relative; }
  /* placeholder while the pnl series is in flight — same box PmSpark's
     920x220 viewBox resolves to, so the swap doesn't move the page */
  .pm-chart-pending {
    aspect-ratio: 920 / 220;
    border-radius: var(--r-1);
    background: linear-gradient(180deg, rgba(167,139,250,0.05), rgba(167,139,250,0));
  }
  .pm-chart-svg { display: block; cursor: crosshair; }
  .pf-navchart { touch-action: pan-y; }

  /* HTML axis overlays — kept out of the SVG so text stays legible on mobile */
  .pf-axis-x {
    position: absolute; left: 0; right: 0; bottom: 2px; height: 12px;
    pointer-events: none;
  }
  .pf-axis-x span {
    position: absolute; transform: translateX(-50%);
    font-family: var(--font-mono); font-size: 10px;
    color: rgba(229,225,241,0.45); letter-spacing: 0.06em; white-space: nowrap;
  }
  .pf-axis-x span.start { transform: none; }
  .pf-axis-x span.end { transform: translateX(-100%); }
  .pf-axis-zero {
    position: absolute; transform: translateY(-100%);
    font-family: var(--font-mono); font-size: 10px;
    color: rgba(229,225,241,0.4); pointer-events: none; white-space: nowrap;
  }
  .pf-axis-y { position: absolute; inset: 0; pointer-events: none; }
  .pf-axis-y span {
    position: absolute; right: 4px; transform: translateY(-100%);
    font-family: var(--font-mono); font-size: 10px;
    color: rgba(229,225,241,0.45); letter-spacing: 0.06em; white-space: nowrap;
  }
  .pm-peak, .pm-trough {
    position: absolute; font-family: var(--font-mono); font-size: 10px;
    white-space: nowrap; pointer-events: none;
  }
  .pm-peak { color: #a78bfa; transform: translate(-50%, -180%); }
  .pm-trough { color: #ff9ae8; transform: translate(-50%, 80%); }
  .pm-tooltip {
    position: absolute;
    /* --tt-shift is set per hover by useSzTooltipClamp in Chart.jsx: the
       distance the box has to move to stay inside the chart wrap at either
       end. 0 for every column that already fits, which is most of them. */
    transform: translate(calc(-50% + var(--tt-shift, 0px)), calc(-100% - 14px));
    background: rgba(12,8,20,0.95);
    border: 1px solid rgba(167,139,250,0.35);
    border-radius: var(--r-1);
    padding: 6px 10px;
    font-family: var(--font-mono);
    pointer-events: none;
    white-space: nowrap;
    z-index: 5;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  .pm-tooltip::after {
    /* Un-shifted by the same amount, so the arrow stays over the column even
       when the box has slid inward — clamped to the box's own width so it
       can't detach from the tooltip it belongs to. */
    content: ''; position: absolute; bottom: -5px;
    left: clamp(10px, calc(50% - var(--tt-shift, 0px)), calc(100% - 10px));
    transform: translateX(-50%) rotate(45deg);
    width: 8px; height: 8px;
    background: rgba(12,8,20,0.95);
    border-right: 1px solid rgba(167,139,250,0.35);
    border-bottom: 1px solid rgba(167,139,250,0.35);
  }
  /* Flipped variant: box under the anchor, arrow on top. A chart's tooltip sits
     above its column because a column has a whole chart's height above it. The
     attribution bars are a 160px stack of 20px rows, so no row does — the box
     is taller than the list it belongs to and can only hang downward. */
  .pm-tooltip.below { transform: translate(calc(-50% + var(--tt-shift, 0px)), 14px); }
  .pm-tooltip.below::after {
    bottom: auto; top: -5px;
    border-right: none; border-bottom: none;
    border-left: 1px solid rgba(167,139,250,0.35);
    border-top: 1px solid rgba(167,139,250,0.35);
  }
  .pm-tt-date { font-size: 10px; color: var(--fg-4); letter-spacing: 0.08em; text-transform: uppercase; }
  .pm-tt-val  { font-size: 13px; font-weight: 500; margin-top: 2px; }
  .pm-tt-val.pos { color: var(--pos); }
  .pm-tt-val.neg { color: var(--neg); }
  .pf-tt-bench { font-size: 10px; margin-top: 2px; letter-spacing: 0.04em; }
  /* A market title runs to ~90 characters, so it wraps, and it is the one line
     in the box allowed to: nowrap on the rest keeps the figure column intact. */
  .pm-tt-market {
    font-size: 11px; color: var(--fg-2); white-space: normal;
    width: max-content; max-width: min(260px, 70vw); line-height: 1.35;
  }

  /* Attribution hover. Label left, figure right, so the numbers stack into a
     column the eye runs straight down instead of hunting along each line. The
     groups are separated by a rule at the same low contrast as the box border —
     the split (realized vs marked) and the size (staked vs at risk) are two
     different questions and shouldn't read as one list of four. */
  .pm-cat-tt .pm-tt-val { display: flex; align-items: baseline; gap: 8px; }
  .pm-cat-tt-scope {
    font-size: 9px; color: var(--fg-4); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .pm-cat-tt-split {
    margin-top: 6px; padding-top: 5px; border-top: 1px solid rgba(167,139,250,0.22);
  }
  .pm-cat-tt-row {
    display: flex; justify-content: space-between; gap: 20px;
    font-size: 10px; letter-spacing: 0.04em; color: var(--fg-3);
  }
  .pm-cat-tt-row + .pm-cat-tt-row { margin-top: 2px; }
  .pm-cat-tt-row span:first-child { color: var(--fg-4); }
  .pm-cat-tt-row .pos { color: var(--pos); }
  .pm-cat-tt-row .neg { color: var(--neg); }

  /* Benchmark overlay legend (portfolio chart) */
  .pf-bench-legend {
    /* Wraps rather than squeezing: with the nav reading holding the left end,
       a phone-width key and two or three benchmarks used to shrink the swatch
       rows past their text and spill off the right edge. */
    display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: flex-end;
    margin-top: 6px; padding-right: 4px;
    font-family: var(--font-mono); font-size: 10px;
    color: rgba(229,225,241,0.55); letter-spacing: 0.08em;
  }
  .pf-bench-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .pf-bench-swatch {
    display: inline-block; width: 14px; height: 2px; border-radius: 1px;
  }
  /* Live reading in the key (SzKeyReadout) — the NAV at the hovered column.
     margin-right:auto parks it at the left end of a key that is otherwise
     right-aligned; tabular figures keep the row still while the value changes
     under the cursor. */
  .pf-bench-legend .pf-key-readout { margin-right: auto; }
  /* Two readings in one key (the nav, and the capital the benchmarks are staked
     on) stay together at its left end: only the last of them takes the auto
     margin that pushes the swatches right. Where :has() is missing the rule
     drops and they split the gap instead — untidy, not broken. */
  .pf-bench-legend .pf-key-readout:has(+ .pf-key-readout) { margin-right: 0; }
  .pf-key-val {
    color: var(--fg-2); font-weight: 500;
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
    transition: color 160ms ease;
  }
  .pf-key-readout.live .pf-key-val { color: var(--fg-1); }

  /* Total view: multi-series tooltip, clickable stat tiles */
  .cmb-tooltip { display: flex; flex-direction: column; gap: 3px; }
  .cmb-tt-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em;
  }
  .cmb-tt-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .cmb-tt-num { margin-left: auto; padding-left: 14px; font-weight: 500; }
  .cmb-tt-num.pos { color: var(--pos); }
  .cmb-tt-num.neg { color: var(--neg); }
  /* The capital tooltip's total is the sum of the two rows above it, not a
     third series, so it gets a rule instead of a dot — a dot would imply a
     third band on the chart. The dot's width is paid back as padding so the
     figures stay in one column with the rows above. */
  .cmb-tt-sum {
    border-top: 1px solid rgba(229,225,241,0.14);
    margin-top: 2px; padding-top: 5px; padding-left: 14px;
    color: var(--fg-2);
  }
  .cmb-tt-xfer {
    margin-top: 4px; padding-top: 5px;
    border-top: 1px solid rgba(255,79,216,0.22);
    color: var(--mark-pos); font-size: 10px; letter-spacing: 0.06em;
  }
  .cmb-stat-link { cursor: pointer; transition: border-color 160ms ease, background 160ms ease; }
  .cmb-stat-link:hover { border-color: rgba(167,139,250,0.5); background: rgba(167,139,250,0.06); }
  .cmb-stat-arrow { color: var(--violet-300); opacity: 0.7; }

  /* Event markers + caption on the book charts. The diamond is shared: log
     entries wear it on the total chart and transfers wear it on the capital
     chart, which is why the shape lives on .cmb-annot-sq alone and the pointer
     affordance lives on the .cmb-annot wrapper. Only the log markers take that
     wrapper — they open a caption; a transfer has nothing to open, and its
     amount is already in the tooltip for its column. */
  .cmb-annot { cursor: pointer; }
  .cmb-annot-sq {
    fill: var(--fg-1); opacity: 0.7;
    stroke: transparent; stroke-width: 1.5;
    transition: opacity 160ms var(--ease-out), fill 160ms var(--ease-out), stroke 160ms var(--ease-out);
  }
  .cmb-annot:hover .cmb-annot-sq { opacity: 0.9; }
  .cmb-annot.active .cmb-annot-sq { opacity: 1; stroke: var(--violet-400); }
  .cmb-annot-cap {
    margin-top: 14px; padding: 12px 14px;
    border: 1px solid var(--ink-4); border-left: 2px solid var(--violet-400);
    border-radius: var(--r-1); background: rgba(167,139,250,0.04);
  }
  .cmb-annot-cap-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
  }
  /* Collapsed: the date bar alone, its rule and tint dropped so a dismissed
     note reads as a handle rather than as an empty card. */
  .cmb-annot-cap.collapsed {
    padding: 6px 10px; background: transparent; border-left-color: var(--ink-4);
  }
  .cmb-annot-cap.collapsed .cmb-annot-cap-head { margin-bottom: 0; }
  .cmb-annot-nav {
    flex: none; width: 22px; height: 22px; line-height: 1;
    background: transparent; border: 1px solid var(--ink-4); border-radius: var(--r-1);
    color: var(--violet-300); font-family: var(--font-mono); font-size: 12px;
    cursor: pointer;
    transition: border-color 160ms var(--ease-out), color 160ms var(--ease-out);
  }
  .cmb-annot-nav:hover:not(:disabled) { border-color: var(--violet-400); color: var(--violet-400); }
  .cmb-annot-nav:disabled { opacity: 0.3; cursor: default; }
  .cmb-annot-cap-date {
    flex: 1; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
    color: var(--violet-300);
  }
  .cmb-annot-cap-body {
    font-family: var(--font-sans); font-size: 13px; line-height: 1.6;
    color: var(--fg-2); font-weight: 300; margin: 0;
  }
  .cmb-annot-cap-link {
    color: var(--violet-300); text-decoration: none;
    border-bottom: 1px solid rgba(167,139,250,0.4);
  }
  .cmb-annot-cap-link:hover { border-bottom-color: var(--violet-300); }
  /* A note that opens a post says so at the end of its own sentence. Inline,
     not a row under the body: half the log carries a slug, and a block link
     would grow the card by a line on every one of them — which pushes the
     chart down each time you step onto one. */
  .cmb-annot-cap-more {
    color: var(--violet-300); text-decoration: none;
    border-bottom: 1px solid rgba(167,139,250,0.4);
  }
  .cmb-annot-cap-more:hover { border-bottom-color: var(--violet-300); }

  /* ========== Politics ==========
     Logged or not — no conviction ramp. The note carries the nuance; a scale
     in front of it only pretended to. Violet marks a logged place, magenta is
     reserved for the one you are touching, matching the site's hover shift.

     Never use `outline` on these shapes: on an SVG path the UA paints the
     bounding box, not the geometry, which is the white rectangle this used to
     draw around any focused country. Selection rides on the stroke instead. */
  .pol-view { display: flex; flex-direction: column; gap: 20px; }
  .pol-head { padding: 32px 32px 24px; }
  .pol-head .sz-h2 { margin-bottom: 16px; }
  .pol-lede {
    font-family: var(--font-sans); font-size: 15px; line-height: 1.6;
    color: var(--fg-2); font-weight: 300; margin: 0 0 24px; max-width: 560px;
  }
  .pol-controls {
    display: flex; flex-wrap: wrap; gap: 16px 24px;
    align-items: center; justify-content: space-between;
  }
  .pol-scopes { display: flex; gap: 8px; }
  .pol-scope { padding: 8px 14px; font-size: 12px; }
  .pol-scope.is-active { border-color: var(--violet-400); color: var(--violet-300); }

  .pol-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
  .pol-legend-item {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--fg-3);
  }
  .pol-swatch {
    width: 11px; height: 11px; border-radius: 2px; flex: none;
    border: 1px solid var(--border);
  }
  /* Border-heavy, matching how the map paints these — a solid chip would
     promise a filled country. */
  .pol-sw-enthusiastic,
  .pol-sw-qualified,
  .pol-sw-tactical { width: 12px; height: 12px; border-width: 3px; }
  .pol-sw-enthusiastic { border-color: #ff4fd8; background: rgba(255,79,216,0.12); }
  .pol-sw-qualified    { border-color: #a78bfa; background: rgba(167,139,250,0.14); }
  .pol-sw-tactical     { border-color: #f5f0ff; background: rgba(245,240,255,0.10); }
  .pol-sw-none         { background: rgba(167,139,250,0.09); border-color: rgba(167,139,250,0.38); }

  .pol-panel { padding: 20px; }

  .pol-map-panel { position: relative; }
  .pol-loading { min-height: 320px; display: grid; place-items: center; }

  /* The map takes the full width of the panel — the blurb is an overlay now,
     so nothing competes with it for horizontal room. */
  .pol-map-shell { position: relative; width: 100%; }
  .pol-map { width: 100%; height: auto; display: block; overflow: visible; }

  .pol-shape {
    fill: rgba(167,139,250,0.09);
    stroke: rgba(167,139,250,0.40);
    /* Hairline for unmarked shapes. No non-scaling-stroke: marked outlines are
       sized against the geometry in viewBox units, so they have to scale with
       the map — pinned to screen pixels they would swallow Japan again the
       moment the map is rendered narrow. */
    stroke-width: 1.1;
    stroke-linejoin: round;
    /* Fill and stroke color only — transitioning stroke-width makes the
       borders shimmer as the browser re-rasterises them. */
    transition: fill 160ms var(--ease-out), stroke 160ms var(--ease-out);
  }
  /* Enthusiasm ramp — ordinal, warmest first, anchored on magenta-400 itself.
     Stepped down in OKLCH from there: ΔL 0.135 a step, 38° of hue. Validated
     against this surface — monotone lightness, worst adjacent pair ΔE 16.0
     normal / 10.1 protan. The lightness march is what carries it for a
     colorblind reader; the hue arc alone would not.

     Do not raise the warm end to brighten the ramp: sRGB can't hold magenta's
     chroma above L~0.75, so it desaturates into pink. Do not compress the ramp
     to lift the cool end either — that was tried, and it drops the top pair to
     ΔE 13.9, which full-color readers can't separate.

     tactical sits at 2.42:1 against the surface, under the 3:1 guideline. That
     is allowed only because the level is printed as text everywhere it is
     painted — legend, overlay, and both list panels. Keep those labels. */
  /* The scale rides the border, not the fill — flooding whole countries with
     these hues was too loud at map scale. Widths are per-feature and come from
     the geometry (see build-geo.py); nothing here sets stroke-width for a
     marked shape.

     Two ordered warm steps plus a neutral: `tactical` is a vote against rather
     than a colder shade of support, so it reads as colorless instead of as a
     third rung. Checked all-pairs against this surface — normal-vision ΔE 17.8,
     contrast passes on all three. Magenta↔violet sits at ΔE 7.5 under
     protanopia, which is a floor that holds only because the level is printed
     as text everywhere it is painted. Keep those labels. */
  .pol-shape.pol-lv-enthusiastic { stroke: #ff4fd8; fill: rgba(255,79,216,0.10); }
  .pol-shape.pol-lv-qualified    { stroke: #a78bfa; fill: rgba(167,139,250,0.12); }
  .pol-shape.pol-lv-tactical     { stroke: #f5f0ff; fill: rgba(245,240,255,0.09); }

  /* Interaction is fill-only, the mirror of before: the border is the data
     channel now, so hover must not recolor it. A neutral wash inside the
     outline reads as "you are touching this" without claiming a step. */
  .pol-shape[role="button"] { cursor: pointer; }
  .pol-shape[role="button"]:hover { fill: rgba(245,240,255,0.20); }
  .pol-shape:focus,
  .pol-shape:focus-visible { outline: none; }
  .pol-shape:focus-visible,
  .pol-shape.is-selected { fill: rgba(245,240,255,0.30); }

  /* Name of whatever the cursor is over, parked out of the way. */
  .pol-caption {
    position: absolute; left: 4px; bottom: 2px; min-height: 16px;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--violet-300); pointer-events: none;
  }

  /* ---- click-through blurb, pinned to the map's top-right ---- */
  .pol-overlay {
    position: absolute; top: 32px; right: 32px; width: 290px;
    max-width: calc(100% - 64px); z-index: 2;
    /* A place can stack several contests; keep the box inside the map rather
       than letting a busy ballot push it past the panel. */
    max-height: calc(100% - 64px); overflow-y: auto;
    padding: 18px 20px 20px;
    background: rgba(10,6,18,0.88);
    backdrop-filter: blur(20px) saturate(120%);
    -webkit-backdrop-filter: blur(20px) saturate(120%);
    border: 1px solid rgba(167,139,250,0.28);
    border-top-color: rgba(214,199,255,0.34);
    border-radius: var(--r-1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 40px -18px rgba(0,0,0,0.95);
    animation: pol-overlay-in 180ms var(--ease-out);
  }
  @keyframes pol-overlay-in {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: none; }
  }
  .pol-overlay-close {
    position: absolute; top: 10px; right: 12px;
    background: none; border: none; cursor: pointer; padding: 4px;
    font-family: var(--font-mono); font-size: 16px; line-height: 1;
    color: var(--fg-4); transition: color 160ms var(--ease-out);
  }
  .pol-overlay-close:hover { color: var(--magenta-400); }
  .pol-overlay-name {
    font-family: var(--font-display); font-size: 18px; font-weight: 500;
    color: var(--fg-1); letter-spacing: -0.01em; margin: 0 24px 14px 0;
  }
  .pol-dim { color: var(--fg-3); }

  /* A place can carry several contests on one ballot. They stack in rank order
     — head of government, legislature, governor — and the first is the one the
     map is painted from, so it gets the emphasis. */
  .pol-race { padding: 12px 0; border-top: 1px solid var(--border); }
  .pol-race:first-of-type { border-top: none; padding-top: 2px; }
  .pol-race-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .pol-race-office {
    flex: 1 1 auto; min-width: 0;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em;
    color: var(--fg-2);
  }
  .pol-race.is-primary .pol-race-office { color: var(--fg-1); }
  /* The level reads as text in an ink token with the swatch carrying the hue —
     a label tinted with its own series color is the thing that stops being
     legible first. */
  .pol-race-level {
    flex: none; font-family: var(--font-mono); font-size: 9px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-4);
  }
  .pol-race-when {
    font-family: var(--font-sans); font-size: 13px; color: var(--fg-2);
    font-weight: 300; margin-left: 20px;
  }
  .pol-race-pick {
    font-family: var(--font-sans); font-size: 13px; color: var(--fg-1);
    margin-left: 20px; margin-top: 2px;
  }
  .pol-race-note {
    font-family: var(--font-sans); font-size: 12px; line-height: 1.55;
    color: var(--fg-3); font-weight: 300; margin: 6px 0 0 20px;
  }
