  /* When the position was taken, not when the election is — the age is what
     tells you how much to trust it. */
  .pol-race-logged {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--fg-4);
    margin: 7px 0 0 20px;
  }
  .pol-overlay-note {
    font-family: var(--font-sans); font-size: 13px; line-height: 1.6;
    color: var(--fg-3); font-weight: 300; margin: 16px 0 0;
    padding-top: 13px; border-top: 1px solid var(--border);
  }
  @media (max-width: 720px) {
    .pol-overlay { position: static; width: auto; max-width: none; margin-top: 16px; }
  }

  /* ---- calendar + past sympathies ---- */
  .pol-list-panel { padding: 20px 24px 24px; }
  .pol-list-head {
    display: flex; justify-content: space-between; gap: 16px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--fg-3);
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  /* Sits between the past-log header and its rows — a standing caveat on the
     whole panel, not a note attached to any one entry. */
  .pol-disclaimer {
    font-family: var(--font-sans); font-size: 13px; line-height: 1.6;
    color: var(--fg-3); font-weight: 300; font-style: italic;
    margin: 14px 0 4px; padding: 0 8px;
  }

  .pol-list { list-style: none; margin: 0; padding: 0; }
  /* Two lines per race: who and when on top, then how warm, what office and
     the note written with the endorsement. A grid rather than one flex line,
     so a long pick or place wraps inside its own cell instead of shoving the
     date column sideways. Both lists share the tracks, so dates line up
     across panels too. */
  .pol-row {
    /* Upcoming rows are buttons and past rows are divs; without these the two
       size their padding and lines differently and the date columns drift. */
    display: grid; width: 100%; box-sizing: border-box; line-height: 1.45;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 96px 84px;
    grid-template-areas: "name pick when out" "meta note note note";
    column-gap: 16px; row-gap: 4px; align-items: baseline;
    padding: 11px 8px; background: none; border: none; text-align: left;
    border-bottom: 1px solid rgba(61,51,79,0.4);
    font-family: var(--font-sans); font-size: 13px; color: var(--fg-2);
    transition: background 160ms var(--ease-out), color 160ms var(--ease-out);
  }
  button.pol-row { cursor: pointer; }
  button.pol-row:hover { background: rgba(167,139,250,0.07); color: var(--fg-1); }
  button.pol-row.is-selected { background: rgba(255,79,216,0.10); color: var(--fg-1); }
  .pol-row-name {
    grid-area: name; min-width: 0; color: var(--fg-1);
    display: flex; align-items: center; gap: 9px;
  }
  .pol-row-pick { grid-area: pick; min-width: 0; color: var(--fg-1); }
  .pol-row-when {
    grid-area: when; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
  }
  .pol-row-out {
    grid-area: out; text-align: right;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
    color: var(--violet-300);
  }
  /* Indented past the swatch so it reads under the place name. */
  .pol-row-meta {
    grid-area: meta; min-width: 0; padding-left: 21px;
    font-size: 12px; color: var(--fg-3);
  }
  .pol-row-level {
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  .pol-row-note {
    grid-area: note; min-width: 0;
    font-size: 12px; line-height: 1.55; font-weight: 300; color: var(--fg-3);
  }
  @media (max-width: 720px) {
    .pol-row {
      grid-template-columns: minmax(0, 1fr) 96px;
      grid-template-areas: "name when" "pick out" "meta meta" "note note";
      column-gap: 12px;
    }
    .pol-row-pick { padding-left: 21px; }
    .pol-row-note { padding-left: 21px; }
  }
  /* ---- election calendar strip ---- */
  .pol-strip { padding: 18px 8px 6px; border-bottom: 1px solid var(--border); }
  .pol-strip-plot { position: relative; width: 100%; }
  /* The baseline and month rules are solid and faint — never dashed. */
  .pol-strip-plot::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 18px;
    height: 1px; background: rgba(167,139,250,0.30);
  }
  .pol-strip-tick {
    position: absolute; top: 0; bottom: 18px; width: 1px;
    background: rgba(167,139,250,0.12);
  }
  .pol-strip-tick.is-today { background: rgba(245,240,255,0.28); }
  .pol-strip-label {
    position: absolute; top: 100%; left: 0; transform: translateX(-50%);
    padding-top: 5px; white-space: nowrap;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--fg-4);
  }
  .pol-strip-tick.is-today .pol-strip-label { transform: none; left: -2px; color: var(--fg-3); }
  .pol-strip-chip {
    position: absolute; padding: 0; cursor: pointer; z-index: 1;
    transition: background 160ms var(--ease-out);
  }
  .pol-strip-chip:hover,
  .pol-strip-chip:focus-visible { background: rgba(245,240,255,0.35); outline: none; }
  .pol-strip-chip.is-selected { background: rgba(245,240,255,0.55); }
  .pol-strip-readout {
    min-height: 18px; margin-top: 8px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--fg-2);
  }
  .pol-strip-name { color: var(--fg-1); }

  /* ========== Records ========== */
  /* The calendar scales with the panel down to ~0.72 of its drawn pitch, then
     scrolls sideways (Records.jsx sets the floor as min-width and lands the
     scroll on the recent end). */
  .rec-cal-scroll {
    overflow-x: auto; overflow-y: hidden; padding-bottom: 8px;
    scrollbar-width: thin; scrollbar-color: rgba(167,139,250,0.3) transparent;
  }
  .rec-cal { width: 100%; height: auto; display: block; touch-action: pan-x; }
  .rec-cal-label {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em;
    fill: var(--fg-4);
  }
  .rec-cal-year {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em;
    fill: var(--fg-2);
  }
  .rec-readout {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px;
    min-height: 20px; margin-top: 12px;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em;
    color: var(--fg-2); font-variant-numeric: tabular-nums;
  }
  .rec-readout .pos { color: var(--pos); }
  .rec-readout .neg { color: var(--neg); }
  .rec-readout-date { color: var(--fg-1); }
  .rec-readout-legs { color: var(--fg-4); font-size: 11px; }
  .rec-readout-high { color: var(--fg-1); font-size: 11px; }
  .rec-legend {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 1px;
    margin-top: 10px;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
    color: var(--fg-4); text-transform: uppercase;
  }
  .rec-legend > span:first-child { margin-right: 5px; }
  .rec-legend svg + span { margin-left: 5px; }
  .rec-legend-scale { margin-left: 16px !important; text-transform: none; letter-spacing: 0.04em; }
  .rec-legend-high { margin-left: 16px; display: inline-flex; align-items: center; gap: 6px; }

  /* Best | worst pairs: one question per row, both answers beside each other. */
  .rec-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rec-row {
    display: grid; grid-template-columns: auto minmax(0, 1fr);
    grid-template-areas: "label label" "value note" "when when";
    align-items: baseline; gap: 2px 12px;
    padding: 14px 16px; text-align: left;
    background: transparent; border: none; border-radius: var(--r-1);
    border-bottom: 1px solid var(--border-soft);
    color: inherit; font: inherit; cursor: pointer;
    transition: background 120ms ease;
  }
  .rec-grid > .rec-row { border-radius: 0; }
  .rec-grid > .rec-row:nth-child(odd) { border-right: 1px solid var(--border-soft); }
  .rec-grid > .rec-row:nth-last-child(-n+2) { border-bottom: none; }
  /* Milestones: one column per ladder, rungs stacked in the order reached. */
  .rec-ladders { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .rec-ladder { display: flex; flex-direction: column; }
  .rec-ladder + .rec-ladder { border-left: 1px solid var(--border-soft); }
  .rec-ladder > .rec-row { border-radius: 0; }
  .rec-ladder > .rec-row:last-child { border-bottom: none; }
