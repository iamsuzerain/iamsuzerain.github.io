<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>suzerain — personal site</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  /* ========== Chrome ========== */
  html, body { margin: 0; padding: 0; min-height: 100vh; background: var(--ink-1); overflow-x: hidden; }
  .sz-chrome { position: relative; min-height: 100vh; overflow: hidden; }

  /* base violet bloom — keep */
  .sz-grid {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(rgba(167,139,250,0.06) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .sz-aurora {
    position: fixed; top: -200px; right: -200px; width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(167,139,250,0.18), transparent 60%);
    pointer-events: none; z-index: 0;
  }

  /* ========== Rained-on-glass layer ========== */
  /* Background ambient clouds that drift — what the glass refracts */
  .sz-glass-behind {
    position: fixed; inset: -10%; pointer-events: none; z-index: 0;
    background:
      radial-gradient(600px 500px at 20% 10%, rgba(167,139,250,0.35), transparent 60%),
      radial-gradient(700px 600px at 85% 30%, rgba(255,79,216,0.22), transparent 65%),
      radial-gradient(500px 500px at 40% 85%, rgba(122,90,248,0.28), transparent 65%),
      radial-gradient(400px 400px at 95% 95%, rgba(255,79,216,0.18), transparent 60%);
    filter: blur(40px);
    animation: sz-drift 42s ease-in-out infinite alternate;
  }
  @keyframes sz-drift {
    0%   { transform: translate3d(-2%, -1%, 0) scale(1.02); }
    50%  { transform: translate3d(2%, 1%, 0) scale(1.05); }
    100% { transform: translate3d(-1%, 2%, 0) scale(1.02); }
  }

  /* The glass pane — frosted, refractive via SVG filter */
  .sz-glass {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background:
      linear-gradient(180deg, rgba(10,6,18,0.35) 0%, rgba(10,6,18,0.55) 100%);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    /* subtle fogging on the glass itself */
    box-shadow: inset 0 0 200px rgba(10,6,18,0.4);
  }

  /* Droplet layer sits on top of glass, with its own refraction filter */
  .sz-droplets {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    width: 100%; height: 100%;
    /* droplets are rendered with an SVG filter that makes them feel wet */
    mix-blend-mode: screen;
  }

  /* Trickle streaks — thin vertical lines of brighter glass, slowly running down */
  .sz-trickle {
    position: fixed; top: 0; pointer-events: none; z-index: 2;
    width: 2px; height: 40px;
    background: linear-gradient(180deg,
      transparent 0%,
      rgba(229,225,241,0.28) 30%,
      rgba(255,79,216,0.25) 65%,
      transparent 100%);
    border-radius: 4px;
    filter: blur(0.5px);
    animation: sz-drip linear infinite;
    opacity: 0;
  }
  @keyframes sz-drip {
    0%   { transform: translateY(-40px); opacity: 0; }
    8%   { opacity: 0.8; }
    92%  { opacity: 0.8; }
    100% { transform: translateY(100vh); opacity: 0; }
  }

  .sz-cursor-glow {
    position: fixed; top: 0; left: 0; width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(167,139,250,0.2), transparent 60%);
    pointer-events: none; z-index: 3; transition: transform 80ms linear;
    mix-blend-mode: screen;
  }

  /* Respect reduced motion — drop the drift + drip animations */
  @media (prefers-reduced-motion: reduce) {
    .sz-glass-behind, .sz-trickle { animation: none; }
  }

  .sz-stage {
    position: relative; z-index: 4;
    max-width: 1080px; margin: 0 auto; padding: 24px 48px 96px;
  }

  /* ========== Nav ========== */
  .sz-nav {
    display: flex; align-items: center; gap: 28px;
    padding: 14px 20px; margin-bottom: 80px;
    background: rgba(10,6,18,0.6);
    backdrop-filter: blur(12px);
    border: 1px solid var(--ink-4);
    border-radius: 4px;
    font-family: var(--font-mono); font-size: 13px;
    position: sticky; top: 16px; z-index: 10;
  }
  .sz-brand {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-mono); font-size: 15px; font-weight: 500;
    color: var(--fg-1); background: transparent; border: 0; cursor: pointer;
    padding: 0; letter-spacing: -0.01em;
  }
  .sz-nav-items { display: flex; gap: 20px; margin-left: 20px; flex: 1; }
  .sz-nav-item {
    background: transparent; border: 0; cursor: pointer;
    font-family: var(--font-mono); font-size: 13px;
    color: var(--fg-2); padding: 4px 0;
    transition: color 120ms var(--ease-out);
  }
  .sz-nav-item:hover { color: var(--magenta-400); }
  .sz-nav-item.active { color: var(--fg-1); }
  .sz-nav-arrow { color: var(--violet-400); }
  .sz-nav-meta {
    color: var(--fg-3); font-size: 10px;
    letter-spacing: 0.14em; text-transform: uppercase;
  }

  /* ========== Cursor ========== */
  .sz-cursor {
    color: var(--magenta-400);
    animation: sz-blink 1s steps(1, end) infinite;
    display: inline-block;
    margin-left: 2px;
  }
  @keyframes sz-blink { 50% { opacity: 0; } }

  /* ========== Shared primitives ========== */
  .sz-kicker {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--violet-300); margin-bottom: 24px;
  }
  .sz-h2 {
    font-family: var(--font-display); font-size: 44px; font-weight: 500;
    color: var(--fg-1); letter-spacing: -0.02em; line-height: 1.05;
    margin: 0 0 32px; max-width: 760px;
  }
  .sz-h3 {
    font-family: var(--font-mono); font-size: 17px; font-weight: 500;
    color: var(--fg-1); margin: 40px 0 16px; letter-spacing: -0.01em;
  }
  .sz-dim { color: var(--fg-3); }
  .sz-sep { color: var(--fg-dim); margin: 0 6px; }
  .sz-meta {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--fg-3); margin-top: 32px;
  }

  /* ========== Buttons ========== */
  .sz-btn {
    font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.06em;
    padding: 10px 18px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--ink-4); background: transparent; color: var(--fg-1);
    transition: all 160ms var(--ease-out);
  }
  .sz-btn:hover { border-color: var(--violet-400); color: var(--violet-300); }
  .sz-btn:active { transform: scale(0.98); }
  .sz-btn-primary {
    background: var(--violet-400); color: var(--ink-0);
    border-color: var(--violet-400); font-weight: 500;
  }
  .sz-btn-primary:hover {
    background: var(--magenta-400); border-color: var(--magenta-400);
    color: var(--ink-0); box-shadow: 0 0 24px rgba(255,79,216,0.4);
  }
  .sz-btn-ghost { border-color: transparent; color: var(--violet-300); }
  .sz-btn-ghost:hover { color: var(--magenta-400); border-color: transparent; }

  /* ========== Hero ========== */
  .sz-hero { padding: 40px 0 60px; }
  .sz-hero-meta {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--fg-3); margin-bottom: 24px;
  }
  .sz-hero-name {
    font-family: var(--font-display); font-size: 120px; font-weight: 500;
    color: var(--fg-1); letter-spacing: -0.04em; line-height: 0.95;
    margin: 0; white-space: nowrap;
  }
  .sz-hero-tag {
    font-family: var(--font-display); font-size: 32px; font-weight: 300;
    color: var(--fg-2); letter-spacing: -0.02em; line-height: 1.15;
    margin: 28px 0 12px; max-width: 780px; min-height: 40px;
  }
  .sz-hero-sub {
    font-family: var(--font-sans); font-size: 17px;
    color: var(--fg-3); max-width: 560px; margin: 0 0 36px;
  }
  .sz-hero-cta { display: flex; gap: 12px; margin-bottom: 64px; }
  .sz-hero-footer {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--fg-3); letter-spacing: 0.04em;
    display: flex; flex-wrap: wrap; gap: 2px;
    padding-top: 24px; border-top: 1px solid var(--border-soft);
  }

  /* ========== Prose / About ========== */
  .sz-prose { max-width: 680px; }
  .sz-prose p {
    font-family: var(--font-sans); font-size: 17px; line-height: 1.7;
    color: var(--fg-2); margin: 0 0 20px; font-weight: 300;
  }
  .sz-links {
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 8px;
    font-family: var(--font-mono); font-size: 13px;
  }
  .sz-links a { color: var(--fg-2); }
  .sz-links a:hover { color: var(--magenta-400); }

  /* ========== Projects ========== */
  .sz-wide { max-width: 1080px; }
  .sz-filters {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0 24px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border-soft);
    flex-wrap: wrap;
  }
  .sz-filter-label {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--fg-3); margin-right: 8px;
  }
  .sz-filter {
    font-family: var(--font-mono); font-size: 12px;
    background: transparent; border: 1px solid var(--ink-4);
    border-radius: 999px; padding: 5px 12px; cursor: pointer;
    color: var(--fg-2); transition: all 160ms var(--ease-out);
    letter-spacing: 0.04em;
  }
  .sz-filter:hover { border-color: var(--violet-400); color: var(--violet-300); }
  .sz-filter.active { border-color: var(--violet-400); color: var(--violet-300); background: rgba(167,139,250,0.08); }
  .sz-proj-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .sz-proj-card {
    background: var(--ink-3); border: 1px solid var(--ink-4);
    border-radius: 4px; padding: 20px 22px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: inset 0 0 0 1px rgba(167,139,250,0.15);
    transition: border-color 200ms var(--ease-out), transform 200ms var(--ease-out);
  }
  .sz-proj-card:hover { border-color: rgba(167,139,250,0.5); transform: translateY(-1px); }
  .sz-proj-head { display: flex; justify-content: space-between; align-items: center; }
  .sz-proj-meta {
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--fg-3); display: flex; align-items: center;
  }
  .sz-proj-open {
    font-family: var(--font-mono); font-size: 11px;
    background: transparent; border: 0; color: var(--violet-300);
    cursor: pointer; letter-spacing: 0.08em;
  }
  .sz-proj-open:hover { color: var(--magenta-400); }
  .sz-proj-name {
    font-family: var(--font-mono); font-size: 24px; font-weight: 500;
    color: var(--fg-1); margin: 0; letter-spacing: -0.01em;
  }
  .sz-proj-desc {
    font-family: var(--font-sans); font-size: 14px; line-height: 1.55;
    color: var(--fg-2); margin: 0;
  }
  .sz-proj-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .sz-tag {
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--fg-3); padding: 3px 8px;
    border: 1px solid var(--ink-4); border-radius: 999px;
  }

  /* ========== Writing ========== */
  .sz-reading { max-width: 860px; }
  .sz-posts { list-style: none; padding: 0; margin: 32px 0 0; }
  .sz-post {
    display: grid;
    grid-template-columns: 110px 1fr auto auto;
    gap: 20px; align-items: baseline;
    padding: 16px 0; border-bottom: 1px solid var(--border-soft);
    font-family: var(--font-mono); font-size: 13px;
  }
  .sz-post:hover { background: rgba(167,139,250,0.03); }
  .sz-post-date { color: var(--fg-3); letter-spacing: 0.06em; }
  .sz-post-title {
    font-family: var(--font-sans); font-size: 16px; font-weight: 400;
    color: var(--fg-1); border-bottom: 1px solid transparent;
  }
  .sz-post-title:hover { color: var(--magenta-400); }
  .sz-post-tags { display: flex; gap: 4px; }
  .sz-tag-quiet { border-color: transparent; color: var(--fg-4); }
  .sz-post-read { color: var(--fg-4); font-size: 11px; }
  /* ========== Log / Blog ========== */
  .sz-log {
    margin-top: 64px;
    margin-bottom: 64px;
    border-top: 1px solid var(--border-soft);
    padding-top: 40px;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }
  .sz-log-entry { display: grid; grid-template-columns: 110px 1fr; gap: 24px; }
  .sz-log-date {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.1em; color: var(--fg-4);
    padding-top: 3px;
  }
  .sz-log-body {
    font-family: var(--font-sans); font-size: 16px;
    line-height: 1.7; color: var(--fg-2);
    margin: 0; font-weight: 300;
  }

  .sz-rss {
    margin-top: 32px; padding: 16px 0;
    font-family: var(--font-mono); font-size: 12px;
    color: var(--fg-3); display: flex; gap: 10px; align-items: center;
    letter-spacing: 0.06em;
  }
  .sz-rss a { color: var(--violet-300); }

  /* ========== Contact ========== */
  .sz-contact { max-width: 1040px; }
  .sz-contact-grid {
    display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px;
    margin-top: 32px;
  }
  .sz-terminal {
    background: var(--ink-0); border: 1px solid var(--violet-400);
    border-radius: 4px; overflow: hidden;
    box-shadow: 0 0 40px rgba(167,139,250,0.18);
  }
  .sz-term-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: var(--ink-2); border-bottom: 1px solid var(--ink-4);
  }
  .sz-term-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .sz-term-title {
    margin-left: 8px; font-family: var(--font-mono); font-size: 11px;
    color: var(--fg-3); letter-spacing: 0.1em;
  }
  .sz-term-body {
    padding: 18px 20px; font-family: var(--font-mono); font-size: 13px;
    color: var(--fg-1); display: flex; flex-direction: column; gap: 12px;
    min-height: 300px;
  }
  .sz-term-prompt { color: var(--violet-400); margin-right: 6px; }
  .sz-term-input {
    background: transparent; border: 0; border-left: 2px solid var(--violet-400);
    padding: 4px 0 4px 12px;
    font-family: var(--font-mono); font-size: 13px; color: var(--fg-1);
    outline: none; resize: vertical; min-height: 110px; line-height: 1.5;
  }
  .sz-term-input:focus { border-left-color: var(--magenta-400); }
  .sz-term-ok { color: #7dd3a8; letter-spacing: 0.06em; }

  .sz-contact-links h3:first-of-type { margin-top: 0; }

  /* ========== Portfolio ========== */
  .pf-wrap { max-width: 1080px; }
  .pf-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 40px; margin-bottom: 32px; flex-wrap: wrap;
  }
  .pf-head .sz-h2 { margin-bottom: 8px; }
  .pf-currency {
    font-family: var(--font-mono); font-size: 13px;
    color: var(--fg-3); margin-left: 12px;
    letter-spacing: 0.14em; text-transform: uppercase;
    vertical-align: middle;
  }
  .pf-sub {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--fg-3); letter-spacing: 0.04em;
    display: flex; flex-wrap: wrap; gap: 2px;
  }
  .pf-updated {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 11px;
    color: var(--fg-3); letter-spacing: 0.1em; text-transform: uppercase;
    padding: 8px 14px; border: 1px solid var(--ink-4); border-radius: 999px;
    background: rgba(10,6,18,0.6);
    white-space: nowrap;
  }
  .pf-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #7dd3a8; box-shadow: 0 0 8px rgba(125,211,168,0.6);
    animation: sz-blink 2s ease-in-out infinite;
  }

  .pf-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 32px;
  }
  .pf-stat {
    background: var(--ink-3); border: 1px solid var(--ink-4);
    border-radius: 4px; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .pf-stat-label {
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--fg-3);
  }
  .pf-stat-value {
    font-family: var(--font-display); font-size: 30px; font-weight: 400;
    color: var(--fg-1); letter-spacing: -0.02em; line-height: 1.1;
  }
  .pf-stat-chg {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em;
  }
  .pf-stat-chg.pos { color: #7dd3a8; }
  .pf-stat-chg.neg { color: #ff6b9d; }
  .pf-stat-kicker {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--fg-4); letter-spacing: 0.1em;
  }

  .pf-panel {
    background: var(--ink-3); border: 1px solid var(--ink-4);
    border-radius: 4px; padding: 20px 22px;
    margin-bottom: 16px;
  }
  .pf-panel-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 16px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border-soft);
  }
  .pf-panel-title {
    font-family: var(--font-mono); font-size: 13px; font-weight: 500;
    color: var(--fg-1); letter-spacing: 0.02em;
  }
  .pf-panel-meta {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--fg-4); letter-spacing: 0.14em; text-transform: uppercase;
  }
  .pf-navchart { width: 100%; height: auto; display: block; }

  .pf-row {
    display: grid; grid-template-columns: 280px 1fr; gap: 16px;
    margin-bottom: 16px;
  }
  .pf-panel-alloc, .pf-panel-pos { margin-bottom: 0; }
  .pf-alloc { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .pf-donut { width: 160px; height: 160px; }
  .pf-legend {
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 6px; width: 100%;
    font-family: var(--font-mono); font-size: 11px;
  }
  .pf-legend li {
    display: grid; grid-template-columns: 10px 1fr auto;
    gap: 10px; align-items: center;
  }
  .pf-legend-dot { width: 8px; height: 8px; border-radius: 1px; }
  .pf-legend-label { color: var(--fg-2); letter-spacing: 0.02em; }
  .pf-legend-pct { color: var(--fg-3); font-variant-numeric: tabular-nums; }

  .pf-table-wrap { overflow-x: auto; }
  .pf-table {
    width: 100%; border-collapse: collapse;
    font-family: var(--font-mono); font-size: 12px;
  }
  .pf-table th {
    text-align: left; padding: 8px 10px 10px;
    color: var(--fg-4); letter-spacing: 0.12em; text-transform: uppercase;
    font-size: 10px; font-weight: 400;
    border-bottom: 1px solid var(--border-soft);
  }
  .pf-table td {
    padding: 10px; border-bottom: 1px dashed rgba(167,139,250,0.08);
    color: var(--fg-2);
  }
  .pf-table tr:hover td { background: rgba(167,139,250,0.04); }
  .pf-table .pf-num { text-align: right; font-variant-numeric: tabular-nums; }
  .pf-table .pf-sym { color: var(--fg-1); font-weight: 500; }
  .pf-table .pf-name { color: var(--fg-3); font-family: var(--font-sans); font-size: 13px; }
  .pf-table .pos { color: #7dd3a8; }
  .pf-table .neg { color: #ff6b9d; }
  .pf-type-badge {
    display: inline-block;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;
    padding: 2px 6px; border-radius: 3px;
    border: 1px solid rgba(167,139,250,0.35);
    color: rgba(167,139,250,0.85);
    white-space: nowrap;
  }
  .pf-type-badge:is([data-type="call"], [data-type="fut·call"]) { border-color: rgba(255,154,232,0.4); color: rgba(255,154,232,0.9); }
  .pf-type-badge:is([data-type="put"], [data-type="fut·put"])   { border-color: rgba(255,79,216,0.4);  color: rgba(255,79,216,0.9); }
  .pf-type-badge[data-type="crypto"] { border-color: rgba(255,79,216,0.35); color: rgba(255,154,232,0.85); }
  .pf-type-badge[data-type="ETF"]    { border-color: rgba(196,181,253,0.4); color: rgba(196,181,253,0.9); }
  .pf-type-badge[data-type="ADR"]    { border-color: rgba(196,181,253,0.35); color: rgba(196,181,253,0.85); }

  .pf-footer {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--fg-4); letter-spacing: 0.06em;
    margin-top: 32px; padding-top: 20px;
    border-top: 1px solid var(--border-soft);
    display: flex; flex-wrap: wrap; gap: 2px;
  }

  /* ========== Predictfolio ========== */
  .pm-wrap { max-width: 1080px; }
  .pm-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 40px; margin-bottom: 28px; flex-wrap: wrap;
  }
  .pm-head .sz-h2 { margin-bottom: 16px; }
