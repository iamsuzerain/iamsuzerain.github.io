<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .field {
    display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 200px;
  }
  .field label {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--fg-3);
  }
  .field input, .field textarea {
    font-family: var(--font-mono); font-size: 13px;
    background: var(--ink-2); color: var(--fg-1);
    border: 1px solid var(--ink-4);
    border-radius: 4px; padding: 10px 12px; outline: none;
    transition: border-color 160ms cubic-bezier(0.22,1,0.36,1);
  }
  .field input:focus, .field textarea:focus {
    border-color: var(--violet-400);
    box-shadow: 0 0 0 3px rgba(167,139,250,0.12);
  }
  .field input::placeholder { color: var(--fg-4); }
  .prompt-field {
    display: flex; align-items: center; gap: 10px;
    background: var(--ink-2); border: 1px solid var(--violet-400);
    padding: 10px 14px; border-radius: 0;
    font-family: var(--font-mono); font-size: 13px;
  }
  .prompt-field .sigil { color: var(--magenta-400); }
  .prompt-field input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--fg-1); font-family: inherit; font-size: inherit;
  }
  .prompt-field .cursor { color: var(--magenta-400); animation: blink 1s steps(1,end) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style></head>
<body class="card">
  <div class="label">fields · inputs</div>
  <div class="row">
    <div class="field">
      <label>email</label>
      <input type="text" value="hello@suzerain.dev"/>
    </div>
    <div class="field">
      <label>name</label>
      <input type="text" placeholder="enter your name…"/>
    </div>
  </div>
  <div class="prompt-field">
    <span class="sigil">▸</span>
    <input value="search writing, projects"/>
    <span class="cursor">▋</span>
  </div>
</body></html>
