<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../ui_kits/personal_site/colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body class="card">
  <div class="label">magenta · heat · used sparingly</div>
  <div class="row">
    <div class="swatch grow" style="background:#ff8de4;color:#2e1065"><span class="sw-name">300</span><span class="sw-hex">#ff8de4</span></div>
    <div class="swatch grow" style="background:#ff4fd8;color:#0a0612;box-shadow:inset 0 0 0 2px #a78bfa"><span class="sw-name">400 ◆ hot</span><span class="sw-hex">#ff4fd8</span></div>
    <div class="swatch grow" style="background:#e11d87;color:#f5f0ff"><span class="sw-name">500</span><span class="sw-hex">#e11d87</span></div>
    <div class="swatch grow" style="background:#be185d;color:#f5f0ff"><span class="sw-name">600</span><span class="sw-hex">#be185d</span></div>
  </div>
  <div class="label">semantic · status</div>
  <div class="row">
    <div class="chip"><span class="dot" style="background:#7dd3a8"></span>ok · #7dd3a8</div>
    <div class="chip"><span class="dot" style="background:#f0c674"></span>warn · #f0c674</div>
    <div class="chip"><span class="dot" style="background:#ff6b8a"></span>err · #ff6b8a</div>
    <div class="chip"><span class="dot" style="background:#ff4fd8"></span>selection · #ff4fd8</div>
  </div>
</body></html>
