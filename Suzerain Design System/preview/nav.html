<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .nav {
    display: flex; align-items: center; gap: 28px;
    padding: 14px 20px;
    background: rgba(10,6,18,0.7);
    backdrop-filter: blur(12px);
    border: 1px solid var(--ink-4);
    border-radius: 4px;
    font-family: var(--font-mono); font-size: 13px;
    letter-spacing: 0.04em;
  }
  .nav a {
    color: var(--fg-2); border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: color 120ms cubic-bezier(0.22,1,0.36,1);
  }
  .nav a:hover { color: var(--magenta-400); }
  .nav a.active { color: var(--fg-1); }
  .nav a.active::before { content: "→ "; color: var(--violet-400); }
  .nav .brand {
    color: var(--fg-1); font-weight: 500; letter-spacing: -0.01em;
    margin-right: 12px;
  }
  .nav .brand .cursor { color: var(--magenta-400); animation: blink 1s steps(1,end) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .nav .spacer { flex: 1; }
  .nav .meta { color: var(--fg-3); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
</style></head>
<body class="card">
  <div class="label">nav · horizontal · mono · lowercase</div>
  <nav class="nav">
    <span class="brand">suzerain<span class="cursor">▋</span></span>
    <a href="#" class="active">about</a>
    <a href="#">projects</a>
    <a href="#">writing</a>
    <a href="#">contact</a>
    <span class="spacer"></span>
    <span class="meta">◆ 2026</span>
  </nav>
</body></html>
