<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  button {
    font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.08em;
    padding: 10px 18px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--ink-4); background: transparent; color: var(--fg-1);
    transition: all 160ms cubic-bezier(0.22,1,0.36,1);
  }
  button:hover { border-color: var(--violet-400); color: var(--violet-300); }
  .btn-primary {
    background: var(--violet-400); color: var(--ink-0);
    border-color: var(--violet-400); font-weight: 500;
  }
  .btn-primary:hover {
    background: var(--magenta-400); border-color: var(--magenta-400);
    color: var(--ink-0);
    box-shadow: 0 0 24px rgba(255,79,216,0.4);
  }
  .btn-ghost { border-color: transparent; color: var(--violet-300); }
  .btn-ghost:hover { color: var(--magenta-400); border-color: transparent; }
  .btn-terminal {
    border: 1px solid var(--violet-400); color: var(--violet-300);
    background: rgba(167,139,250,0.06); border-radius: 0;
  }
  .btn-terminal:hover { background: rgba(167,139,250,0.12); color: var(--fg-1); }
  .btn-disabled { color: var(--fg-4); border-color: var(--fg-dim); cursor: not-allowed; }
</style></head>
<body class="card">
  <div class="label">buttons · states</div>
  <div class="row">
    <button class="btn-primary">▸ send message</button>
    <button>cancel</button>
    <button class="btn-terminal">[ execute ]</button>
    <button class="btn-ghost">skip →</button>
    <button class="btn-disabled" disabled>unavailable</button>
  </div>
  <div class="label">hover = magenta heat · press = scale(.98)</div>
</body></html>
