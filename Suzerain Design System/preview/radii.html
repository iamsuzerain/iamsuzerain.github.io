<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../ui_kits/personal_site/colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .rbox {
    width: 96px; height: 96px;
    background: var(--ink-3);
    border: 1px solid var(--ink-4);
    box-shadow: var(--inner-glow);
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 8px;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
    color: var(--fg-3); text-transform: uppercase;
  }
</style>
</head>
<body class="card">
  <div class="label">radii · 0 / 2 / 4 / 8 / 12 / pill</div>
  <div class="row">
    <div class="rbox" style="border-radius:0">r-0</div>
    <div class="rbox" style="border-radius:2px">r-1 · 2</div>
    <div class="rbox" style="border-radius:4px">r-2 · 4 ◆</div>
    <div class="rbox" style="border-radius:8px">r-3 · 8</div>
    <div class="rbox" style="border-radius:12px">r-4 · 12</div>
    <div class="rbox" style="border-radius:999px">pill</div>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);letter-spacing:0.08em">default is r-2 (4px) · use r-0 for terminal panels · pill reserved for tags</div>
</body></html>
