<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .elev {
    width: 140px; height: 96px;
    background: var(--ink-2);
    border: 1px solid var(--ink-4);
    border-radius: 4px;
    display: flex; align-items: flex-end; padding: 8px;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
    color: var(--fg-3); text-transform: uppercase;
  }
</style>
</head>
<body class="card">
  <div class="label">shadow · glow · elevation</div>
  <div class="row" style="padding-top:16px;padding-bottom:16px;padding-left:4px;padding-right:4px;gap:20px">
    <div class="elev">shadow-1</div>
    <div class="elev" style="box-shadow: 0 8px 24px -8px rgba(0,0,0,0.6)">shadow-2</div>
    <div class="elev" style="box-shadow: 0 24px 64px -24px rgba(0,0,0,0.8)">shadow-3</div>
    <div class="elev" style="box-shadow: inset 0 0 0 1px rgba(167,139,250,0.15)">inner glow</div>
    <div class="elev" style="box-shadow: 0 0 24px rgba(167,139,250,0.35); border-color:var(--violet-400)">glow-violet</div>
    <div class="elev" style="box-shadow: 0 0 24px rgba(255,79,216,0.4); border-color:var(--magenta-400)">glow-magenta</div>
  </div>
</body></html>
