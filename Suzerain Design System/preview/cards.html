<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .pc {
    flex: 1; min-width: 220px;
    background: var(--ink-3); border: 1px solid var(--ink-4);
    border-radius: 4px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: inset 0 0 0 1px rgba(167,139,250,0.15);
    transition: border-color 160ms cubic-bezier(0.22,1,0.36,1), transform 160ms;
  }
  .pc:hover { border-color: rgba(167,139,250,0.5); transform: translateY(-1px); }
  .pc .meta {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--fg-3);
    display: flex; justify-content: space-between;
  }
  .pc h3 {
    font-family: var(--font-mono); font-size: 17px; font-weight: 500;
    color: var(--fg-1); margin: 0; letter-spacing: -0.01em;
  }
  .pc p {
    font-family: var(--font-sans); font-size: 13px; line-height: 1.5;
    color: var(--fg-2); margin: 0;
  }
  .pc .tag {
    font-family: var(--font-mono); font-size: 10px; color: var(--violet-300);
    letter-spacing: 0.12em; text-transform: uppercase;
  }
</style></head>
<body class="card">
  <div class="label">cards · project list style</div>
  <div class="row">
    <article class="pc">
      <div class="meta"><span>◆ v0.3</span><span>2025-11</span></div>
      <h3>ginkgo</h3>
      <p>a tiny static site generator in rust. built because hugo's mental model never stuck.</p>
      <span class="tag">rust · cli · unfinished</span>
    </article>
    <article class="pc">
      <div class="meta"><span>◇ draft</span><span>2026-02</span></div>
      <h3>on suzerainty</h3>
      <p>why personal websites outlast platforms. a short essay.</p>
      <span class="tag">writing · 8 min</span>
    </article>
  </div>
</body></html>
