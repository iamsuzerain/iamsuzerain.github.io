<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../ui_kits/personal_site/colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body class="card">
  <div class="label">ink · surface scale</div>
  <div class="row">
    <div class="swatch grow" style="background:#050309;color:#c4b5d4"><span class="sw-name">ink-0 void</span><span class="sw-hex">#050309</span></div>
    <div class="swatch grow" style="background:#0a0612;color:#c4b5d4"><span class="sw-name">ink-1 base</span><span class="sw-hex">#0a0612</span></div>
    <div class="swatch grow" style="background:#120c1f;color:#c4b5d4"><span class="sw-name">ink-2 raised</span><span class="sw-hex">#120c1f</span></div>
    <div class="swatch grow" style="background:#1a1230;color:#c4b5d4"><span class="sw-name">ink-3 card</span><span class="sw-hex">#1a1230</span></div>
    <div class="swatch grow" style="background:#241a3f;color:#c4b5d4"><span class="sw-name">ink-4 border</span><span class="sw-hex">#241a3f</span></div>
  </div>
  <div class="label">foreground on ink-1</div>
  <div style="display:flex;gap:20px;align-items:baseline;font-family:var(--font-mono);font-size:13px">
    <span style="color:#f5f0ff">fg-1 primary</span>
    <span style="color:#c4b5d4">fg-2 secondary</span>
    <span style="color:#a99bc0">fg-3 tertiary</span>
    <span style="color:#8b7aa8">fg-4 quietest</span>
  </div>
