<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body class="card center">
  <div style="display:flex;gap:32px;align-items:center">
    <img src="../assets/logo-sigil.svg" width="80" height="80"/>
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="font-family:var(--font-mono);font-size:36px;font-weight:500;color:var(--fg-1);letter-spacing:-0.01em;line-height:1">suzerain<span style="color:#ff4fd8;animation:b 1s steps(1,end) infinite">▋</span></div>
      <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-3)">◆ sigil · wordmark · cursor</div>
    </div>
    <div style="width:1px;height:70px;background:var(--border-soft)"></div>
    <img src="../assets/logo-sigil-mono.svg" width="56" height="56" style="color:#f5f0ff"/>
    <div style="background:#f5f0ff;padding:14px;border-radius:4px"><img src="../assets/logo-sigil-mono.svg" width="42" height="42" style="color:#0a0612;display:block"/></div>
  </div>
  <style>@keyframes b{50%{opacity:0}}</style>
</body></html>
