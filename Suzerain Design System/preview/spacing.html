<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../ui_kits/personal_site/colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .stoken { display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:11px; color:var(--fg-2); }
  .stoken .bar { height:14px; background:var(--violet-400); box-shadow:var(--glow-violet-soft); }
  .stoken .meta { color: var(--fg-3); letter-spacing:0.12em; text-transform:uppercase; font-size:10px; min-width:70px; }
</style>
</head>
<body class="card">
  <div class="label">spacing · 4px base grid</div>

    <div class="stoken"><span class="meta">s-2 · 8</span><span class="bar" style="width:8px"></span></div>
    <div class="stoken"><span class="meta">s-3 · 12</span><span class="bar" style="width:12px"></span></div>
    <div class="stoken"><span class="meta">s-4 · 16</span><span class="bar" style="width:16px"></span></div>
    <div class="stoken"><span class="meta">s-5 · 24</span><span class="bar" style="width:24px"></span></div>
    <div class="stoken"><span class="meta">s-6 · 32</span><span class="bar" style="width:32px"></span></div>
    <div class="stoken"><span class="meta">s-7 · 48</span><span class="bar" style="width:48px"></span></div>
    <div class="stoken"><span class="meta">s-8 · 64</span><span class="bar" style="width:64px"></span></div>
    <div class="stoken"><span class="meta">s-9 · 96</span><span class="bar" style="width:96px"></span></div>
    <div class="stoken"><span class="meta">s-10 · 128</span><span class="bar" style="width:128px"></span></div>
  </div>
</body></html>
