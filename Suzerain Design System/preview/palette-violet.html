<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body class="card">
  <div class="label">violet · primary scale</div>
  <div class="row">
    <div class="swatch grow" style="background:#f3f0ff;color:#2e1065"><span class="sw-name">50</span><span class="sw-hex">#f3f0ff</span></div>
    <div class="swatch grow" style="background:#e9e2ff;color:#2e1065"><span class="sw-name">100</span><span class="sw-hex">#e9e2ff</span></div>
    <div class="swatch grow" style="background:#d4c5ff;color:#2e1065"><span class="sw-name">200</span><span class="sw-hex">#d4c5ff</span></div>
    <div class="swatch grow" style="background:#b9a0ff;color:#2e1065"><span class="sw-name">300</span><span class="sw-hex">#b9a0ff</span></div>
    <div class="swatch grow" style="background:#a78bfa;color:#0a0612;box-shadow:inset 0 0 0 2px #ff4fd8"><span class="sw-name">400 ◆ primary</span><span class="sw-hex">#a78bfa</span></div>
    <div class="swatch grow" style="background:#8b5cf6;color:#f5f0ff"><span class="sw-name">500</span><span class="sw-hex">#8b5cf6</span></div>
    <div class="swatch grow" style="background:#7c3aed;color:#f5f0ff"><span class="sw-name">600</span><span class="sw-hex">#7c3aed</span></div>
    <div class="swatch grow" style="background:#6d28d9;color:#f5f0ff"><span class="sw-name">700</span><span class="sw-hex">#6d28d9</span></div>
    <div class="swatch grow" style="background:#4c1d95;color:#f5f0ff"><span class="sw-name">800</span><span class="sw-hex">#4c1d95</span></div>
    <div class="swatch grow" style="background:#2e1065;color:#f5f0ff"><span class="sw-name">900</span><span class="sw-hex">#2e1065</span></div>
  </div>
</body></html>
