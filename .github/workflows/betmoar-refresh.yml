name: betmoar-breakdown-refresh
# Fetches Polymarket profit-by-source breakdown daily

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install deps
        run: pip install curl_cffi

      - name: fetch betmoar breakdown
        run: |
          mkdir -p "Suzerain Design System/ui_kits/personal_site/data"
          python3 "Suzerain Design System/ui_kits/personal_site/scripts/betmoar-breakdown/fetch-betmoar-breakdown.py" \
            > "Suzerain Design System/ui_kits/personal_site/data/polymarket-breakdown.json"
          echo "result:"
          cat "Suzerain Design System/ui_kits/personal_site/data/polymarket-breakdown.json"

      - name: append to history snapshot
        run: |
          python3 - <<'PY'
          import json, pathlib
          data_dir = pathlib.Path("Suzerain Design System/ui_kits/personal_site/data")
          cur = json.loads((data_dir / "polymarket-breakdown.json").read_text())
          hist_path = data_dir / "polymarket-breakdown-history.json"
          hist = json.loads(hist_path.read_text()) if hist_path.exists() else {"rows": []}
          row = {"d": cur["generatedAt"], **cur["totals"]}
          # Polymarket NAV (open positions + idle USDC) that day. The overview's
          # capital base currently values transferred money at what was sent, so
          # it misses every dollar Polymarket has since made or lost. Fixing that
          # needs a NAV *series*, which only exists going forward — the snapshot
          # has carried balances since 2026-07-15 but was never retained.
          nav = (cur.get("balances") or {}).get("nav")
          if nav is not None:
              row["nav"] = nav
          rows = [r for r in hist.get("rows", []) if r.get("d") != row["d"]]
          rows.append(row)
          rows.sort(key=lambda r: r["d"])
          hist["rows"] = rows
          hist_path.write_text(json.dumps(hist, indent=2) + "\n")
          PY

      - name: commit + push if changed
        run: |
          git config user.name  "betmoar-bot"
          git config user.email "betmoar-bot@users.noreply.github.com"
          if git diff --quiet \
              "Suzerain Design System/ui_kits/personal_site/data/polymarket-breakdown.json" \
              "Suzerain Design System/ui_kits/personal_site/data/polymarket-breakdown-history.json"; then
            echo "no changes"
            exit 0
          fi
          git add "Suzerain Design System/ui_kits/personal_site/data/polymarket-breakdown.json" \
                  "Suzerain Design System/ui_kits/personal_site/data/polymarket-breakdown-history.json"
          git commit -m "polymarket: refresh betmoar breakdown $(date -u +%F)"
          # Remote main may have advanced since checkout (concurrent runs / other pushes).
          # Rebase onto it, keeping our freshly generated data on conflict, then retry push.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase -X theirs origin main
          done
