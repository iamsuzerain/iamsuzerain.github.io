name: deploy-pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [betmoar-breakdown-refresh, portfolio-refresh, polymarket-pnl-refresh]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "Suzerain Design System/ui_kits/personal_site"
          force_orphan: true
