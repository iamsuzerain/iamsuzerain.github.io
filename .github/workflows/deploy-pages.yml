name: deploy-pages

on:
  # Manual commits only. A push made with the default GITHUB_TOKEN does not fire
  # workflows, so this trigger never sees the refresh bots — they arrive via
  # workflow_run below, which must therefore list every one of them.
  push:
    branches: [main]
  workflow_run:
    workflows:
      - betmoar-breakdown-refresh
      - portfolio-refresh
      - polymarket-pnl-refresh
      - polymarket-calibration-refresh
    types: [completed]
  workflow_dispatch: {}

# contents:read to check out; pages+id-token to hand the built site straight to
# the Pages deployment API. `contents: write` was only ever needed to force-push
# the gh-pages branch, which nothing does now.
permissions:
  contents: read
  pages: write
  id-token: write

# Four refresh crons can land within seconds of each other, and two deployments
# racing is how 2026-08-06 ended up with one build canceled and its neighbor
# timing out. Newest wins; an in-flight deploy is allowed to finish rather than
# being canceled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pre-compile JSX so the published site doesn't ship Babel standalone
      # (~2.5MB) or transpile in the browser. Local dev still uses in-browser
      # Babel via the text/babel tags in index.html.
      - name: bundle jsx
        working-directory: Suzerain Design System/ui_kits/personal_site
        run: |
          : > app.min.js
          for f in Chrome Chart Nav Hero About Portfolio Polymarket Combined Politics Writing App; do
            npx -y esbuild@0.25.0 "$f.jsx" --format=iife --minify >> app.min.js
          done
          # Stamp the bundle with the commit sha. Pages serves app.min.js with
          # Cache-Control: max-age=600 and the tag carried no version, so a
          # returning browser reused the old bundle for ten minutes without
          # revalidating — shipped fixes simply did not reach anyone who already
          # had the page open, which is indistinguishable from the fix not working.
          sed -i '/@babel\/standalone/d' index.html
          sed -i "s|<script type=\"text/babel\" src=\"Chrome.jsx\"></script>|<script src=\"app.min.js?v=${GITHUB_SHA:0:8}\"></script>|" index.html
          sed -i '/type="text\/babel"/d' index.html
          grep -q "app.min.js?v=${GITHUB_SHA:0:8}" index.html
          rm -f *.jsx

      # Mirrors the "minify the stylesheet" step in build.sh — keep the two in
      # step. The source file's comments are ~60% of its bytes and exist for the
      # next person editing the tokens, not for anyone loading the page.
      - name: minify css
        working-directory: Suzerain Design System/ui_kits/personal_site
        run: |
          npx -y esbuild@0.25.0 colors_and_type.css --minify > colors_and_type.min.css
          grep -q -- '--r-1: *3px' colors_and_type.min.css   # fail loudly on an empty emit
          mv colors_and_type.min.css colors_and_type.css

      - name: generate rss feed
        working-directory: Suzerain Design System/ui_kits/personal_site
        run: |
          python3 - <<'PYEOF'
          import json, html
          from email.utils import format_datetime
          from datetime import datetime, timezone

          SITE = 'https://iamsuzerain.github.io'
          posts = json.load(open('data/posts/index.json'))['posts']
          items = []
          for p in posts:
              link = f"{SITE}/#/thoughts/{p['slug']}"
              dt = datetime.fromisoformat(p['date']).replace(tzinfo=timezone.utc)
              items.append(
                  '<item>'
                  f"<title>{html.escape(p['title'])}</title>"
                  f"<link>{link}</link>"
                  f"<guid isPermaLink=\"false\">{p['slug']}</guid>"
                  f"<pubDate>{format_datetime(dt)}</pubDate>"
                  f"<description>{html.escape(p['summary'])}</description>"
                  '</item>'
              )
          feed = (
              '<?xml version="1.0" encoding="UTF-8"?>'
              '<rss version="2.0"><channel>'
              '<title>suzerain — thoughts</title>'
              f'<link>{SITE}/#/thoughts</link>'
              '<description>notes from the desk</description>'
              + ''.join(items) +
              '</channel></rss>'
          )
          open('feed.xml', 'w', encoding='utf-8').write(feed)
          PYEOF

      # Straight to Pages as an artifact. This used to force-push the built site
      # to a gh-pages branch and wait for GitHub's legacy branch builder to
      # publish it — a second, invisible hop that failed on its own schedule: on
      # 2026-08-06 it sat in deployment_in_progress past its 10-minute timeout
      # three times running while `deploy-pages` itself reported success, so the
      # site served six-hour-old content with nothing to show anything was wrong.
      # No branch, no Jekyll, and a failure here fails this workflow.
      - name: upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Suzerain Design System/ui_kits/personal_site"

      - name: deploy to pages
        id: deployment
        uses: actions/deploy-pages@v4
