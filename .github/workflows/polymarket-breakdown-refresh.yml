name: polymarket-breakdown-refresh
# Fetches Polymarket profit-by-source breakdown daily

on:
  schedule:
    # 06:07 UTC = 23:07 Pacific. Midnight Pacific is 07:00 UTC, so all of hour 6
    # lands on the right side of that deadline while still stamping the row with
    # the correct UTC date — date.today() on the runner is what keys
    # polymarket-breakdown-history.json. The minute is off the top of the hour
    # deliberately: GitHub queues the most schedule events at :00, and this cron
    # sat there for months.
    - cron: '7 6 * * *'   # daily at 06:07 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # The 23:00 Pacific scheduled task on the local machine dispatches this
  # workflow directly; the cron above is the backstop for nights that machine is
  # off. GitHub has been firing schedule events 6-12h late since 2026-08-27, so
  # by the time a cron lands the dispatcher has usually already run — and the
  # late run would re-scrape and overwrite that snapshot with whatever the
  # numbers look like eight hours on.
  #
  # So on the schedule path only: if today's UTC data is already committed, stop
  # here. workflow_dispatch always runs — that is how the dispatcher itself
  # arrives, and it keeps a manual force-refresh possible.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          DATA: "Suzerain Design System/ui_kits/personal_site/data/polymarket-breakdown.json"
        run: |
          python3 - <<'PYEOF'
          import json, os, pathlib
          from datetime import datetime, timezone
          today = datetime.now(timezone.utc).date().isoformat()
          p = pathlib.Path(os.environ["DATA"])
          gen = ""
          if p.exists():
              gen = str(json.loads(p.read_text()).get("generatedAt") or "")[:10]
          fresh = gen == today
          run = not (os.environ["EVENT"] == "schedule" and fresh)
          print(f"event={os.environ['EVENT']} generatedAt={gen or 'none'} "
                f"today={today} already-fresh={fresh} -> run={run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"run={'true' if run else 'false'}", file=f)
          PYEOF

  refresh:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: install deps
        run: pip install curl_cffi

      - name: fetch breakdown
        run: |
          D="Suzerain Design System/ui_kits/personal_site/data"
          mkdir -p "$D"
          # Write to a temp file and move it. A shell truncates a redirect target
          # BEFORE the command runs, and the script reads polymarket-breakdown.json
          # for balances.cashCursor - redirecting straight over it handed the script
          # an empty file and took the 2026-10-19 run down. Moving also means a failed
          # fetch leaves the previous day's data intact instead of emptying it.
          S="Suzerain Design System/ui_kits/personal_site/scripts/polymarket-breakdown"
          python3 "$S/fetch-polymarket-breakdown.py" > "$RUNNER_TEMP/breakdown.json"
          mv "$RUNNER_TEMP/breakdown.json" "$D/polymarket-breakdown.json"
          echo "result:"
          cat "$D/polymarket-breakdown.json"

      - name: append to history snapshot
        run: |
          python3 - <<'PY'
          import json, pathlib
          data_dir = pathlib.Path("Suzerain Design System/ui_kits/personal_site/data")
          cur = json.loads((data_dir / "polymarket-breakdown.json").read_text())
          hist_path = data_dir / "polymarket-breakdown-history.json"
          hist = json.loads(hist_path.read_text()) if hist_path.exists() else {"rows": []}
          row = {"d": cur["generatedAt"], **cur["totals"]}
          # Polymarket NAV (open positions + idle USDC) that day. The book view's
          # capital base currently values transferred money at what was sent, so
          # it misses every dollar Polymarket has since made or lost. Fixing that
          # needs a NAV *series*, which only exists going forward — the snapshot
          # has carried balances since 2026-07-15 but was never retained.
          nav = (cur.get("balances") or {}).get("nav")
          if nav is not None:
              row["nav"] = nav
          rows = [r for r in hist.get("rows", []) if r.get("d") != row["d"]]
          rows.append(row)
          rows.sort(key=lambda r: r["d"])
          hist["rows"] = rows
          hist_path.write_text(json.dumps(hist, indent=2) + "\n")
          PY

      # nav-history's `recorded` rows are balances.nav copied straight out of the
      # history appended above, so rebuilding it here — in the same job, off the
      # scrape that just landed — is what keeps the file in step with its own
      # source. It is the only rebuild: polymarket-pnl-refresh also ran one, ten
      # nominal minutes later, until it was retired on 2026-10-19.
      #
      # That one used to be the only rebuild, which made a fresh scrape and a fresh
      # nav-history two different workflows apart. On the cron path that gap is
      # ~12 minutes and invisible. A manual dispatch fell outside it entirely and
      # left the file on the previous day's scrape until the next scheduled run —
      # up to a day for an afternoon dispatch. Both crons also drift past their
      # nominal times under queue pressure — usually under an hour, but 6-12h
      # every day since 2026-08-27 — so neither the stagger nor the clock is
      # something to date data by. A scheduled task on the local machine
      # dispatches this workflow at 23:00 Pacific for that reason; the cron is
      # the backstop for nights that machine is off.
      #
      # Reads polymarket-pnl.json from disk, which nothing refreshes any more: it
      # only supplies the walk-back for days before the breakdown reported balances
      # (pre-2026-07-15), which the frozen copy covers identically. The recorded
      # rows come from the file written one step above.
      - name: rebuild polymarket nav history
        run: |
          python3 "Suzerain Design System/ui_kits/personal_site/scripts/polymarket-pnl/build-pm-nav-history.py" \
            > /tmp/pm-nav-history.json
          mv /tmp/pm-nav-history.json \
            "Suzerain Design System/ui_kits/personal_site/data/polymarket-nav-history.json"

      # Compares what was just written against the copy in HEAD — a free second
      # reading of every day but today, since the data is a daily snapshot in
      # git. Reports rewritten history, dropped rows and a changed source; fails
      # the job only on dates that are duplicated or out of order, which no
      # reading of the data makes correct and which every chart walks assuming.
      # Failing here skips the commit below, so a broken file is not published.
      # Add --warn-only if that ever needs to be downgraded to a report.
      - name: continuity canary
        run: |
          cd "Suzerain Design System/ui_kits/personal_site"
          python3 scripts/canary/continuity.py data/polymarket-breakdown.json data/polymarket-breakdown-history.json data/polymarket-nav-history.json

      - name: commit + push if changed
        run: |
          git config user.name  "polymarket-bot"
          git config user.email "polymarket-bot@users.noreply.github.com"
          if git diff --quiet \
              "Suzerain Design System/ui_kits/personal_site/data/polymarket-breakdown.json" \
              "Suzerain Design System/ui_kits/personal_site/data/polymarket-breakdown-history.json" \
              "Suzerain Design System/ui_kits/personal_site/data/polymarket-nav-history.json"; then
            echo "no changes"
            exit 0
          fi
          git add "Suzerain Design System/ui_kits/personal_site/data/polymarket-breakdown.json" \
                  "Suzerain Design System/ui_kits/personal_site/data/polymarket-breakdown-history.json" \
                  "Suzerain Design System/ui_kits/personal_site/data/polymarket-nav-history.json"
          git commit -m "polymarket: refresh breakdown $(date -u +%F)"
          # Remote main may have advanced since checkout (concurrent runs / other pushes).
          # Rebase onto it, keeping our freshly generated data on conflict, then retry push.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase -X theirs origin main
          done
