name: portfolio-refresh

# Runs daily at 09:00 GMT (UTC), plus manual trigger.
on:
  schedule:
    - cron: '0 9 * * 1-6'   # weekdays + Saturday, 09:00 GMT
  workflow_dispatch: {}

# Allow the workflow to push the updated JSON back to the repo. `actions: write`
# was only ever needed to dispatch deploy-pages by hand; deploy-pages now picks
# this workflow up via workflow_run, so nothing here dispatches anything.
permissions:
  contents: write

jobs:
  # The 23:10 Pacific scheduled task on the local machine dispatches this
  # workflow directly; the cron above is the backstop for nights that machine is
  # off. GitHub has been firing schedule events 6-12h late since 2026-08-27, so
  # by the time a cron lands the dispatcher has usually already run — and the
  # late run would re-scrape and overwrite that snapshot with whatever the
  # numbers look like eight hours on.
  #
  # So on the schedule path only: if today's UTC data is already committed, stop
  # here. workflow_dispatch always runs — that is how the dispatcher itself
  # arrives, and it keeps a manual force-refresh possible.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          DATA: "Suzerain Design System/ui_kits/personal_site/data/portfolio.json"
        run: |
          python3 - <<'PYEOF'
          import json, os, pathlib
          from datetime import datetime, timezone
          today = datetime.now(timezone.utc).date().isoformat()
          p = pathlib.Path(os.environ["DATA"])
          gen = ""
          if p.exists():
              gen = str(json.loads(p.read_text()).get("generatedAt") or "")[:10]
          fresh = gen == today
          run = not (os.environ["EVENT"] == "schedule" and fresh)
          print(f"event={os.environ['EVENT']} generatedAt={gen or 'none'} "
                f"today={today} already-fresh={fresh} -> run={run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"run={'true' if run else 'false'}", file=f)
          PYEOF

  refresh:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: fetch fed funds (EFFR) for the risk-free leg
        # Ahead of the IBKR step on purpose: fetch-ibkr.py reads this file off
        # disk to charge its Sharpe and Sortino the rate that was actually in
        # force. Best-effort - a NY Fed hiccup keeps the committed rates, and a
        # run with no file at all falls back to rf 0 rather than failing.
        run: |
          mkdir -p "Suzerain Design System/ui_kits/personal_site/data"
          python3 "Suzerain Design System/ui_kits/personal_site/scripts/riskfree/fetch-riskfree.py" \
            > /tmp/riskfree.json \
            && mv /tmp/riskfree.json "Suzerain Design System/ui_kits/personal_site/data/riskfree.json" \
            || echo "EFFR fetch failed - keeping previous riskfree.json"

      - name: fetch IBKR flex statement
        env:
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
        run: |
          mkdir -p "Suzerain Design System/ui_kits/personal_site/data"
          python3 "Suzerain Design System/ui_kits/personal_site/scripts/ibkr-flex/fetch-ibkr.py" \
            > "Suzerain Design System/ui_kits/personal_site/data/portfolio.json"
          echo "first 400 bytes of result:"
          head -c 400 "Suzerain Design System/ui_kits/personal_site/data/portfolio.json"

      - name: merge NAV history
        # Stitch today's trailing-year pnlSeries into the growing multi-year
        # history so days aged out of the Flex window are preserved (MAX range).
        run: |
          python3 "Suzerain Design System/ui_kits/personal_site/scripts/ibkr-flex/merge-nav-history.py"

      - name: fetch benchmark closes (see TICKERS in fetch-benchmarks.py)
        # Best-effort: a Yahoo hiccup shouldn't block the IBKR refresh.
        run: |
          python3 "Suzerain Design System/ui_kits/personal_site/scripts/benchmarks/fetch-benchmarks.py" \
            > /tmp/benchmarks.json \
            && mv /tmp/benchmarks.json "Suzerain Design System/ui_kits/personal_site/data/benchmarks.json" \
            || echo "benchmark fetch failed — keeping previous benchmarks.json"

      - name: commit + push if changed
        run: |
          git config user.name  "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add "Suzerain Design System/ui_kits/personal_site/data/portfolio.json" \
                  "Suzerain Design System/ui_kits/personal_site/data/nav-history.json" \
                  "Suzerain Design System/ui_kits/personal_site/data/benchmarks.json" \
                  "Suzerain Design System/ui_kits/personal_site/data/riskfree.json"
          # Stage first, then test the index rather than running `git diff` over
          # data/, which is blind to untracked files - benchmarks.json is created
          # fresh on a run where it did not previously exist.
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "portfolio: refresh $(date -u +%F)"
          # Remote main may have advanced since checkout (concurrent runs / other pushes).
          # Rebase onto it, keeping our freshly generated data on conflict, then retry push.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase -X theirs origin main
          done
