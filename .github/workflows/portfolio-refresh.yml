name: portfolio-refresh

# Runs daily at 09:00 GMT (UTC), plus manual trigger.
on:
  schedule:
    - cron: '0 9 * * 1-6'   # weekdays + Saturday, 09:00 GMT
  workflow_dispatch: {}

# Allow the workflow to push the updated JSON back to the repo. `actions: write`
# was only ever needed to dispatch deploy-pages by hand; deploy-pages now picks
# this workflow up via workflow_run, so nothing here dispatches anything.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: fetch IBKR flex statement
        env:
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
        run: |
          mkdir -p "Suzerain Design System/ui_kits/personal_site/data"
          python3 "Suzerain Design System/ui_kits/personal_site/scripts/ibkr-flex/fetch-ibkr.py" \
            > "Suzerain Design System/ui_kits/personal_site/data/portfolio.json"
          echo "first 400 bytes of result:"
          head -c 400 "Suzerain Design System/ui_kits/personal_site/data/portfolio.json"

      - name: archive raw statement to private warehouse
        # Why this exists: IBKR's Flex window is a rolling ~365 days, so a
        # statement not captured on the day it is served is unrecoverable. The
        # derived portfolio.json is a lossy projection of it - no trade rows, no
        # option strike/expiry/right - and cannot be back-fitted into the answers
        # those fields support.
        #
        # Why a second query: the site query spans ~365 days, so archiving it
        # daily would re-store a year of already-archived history every run, in
        # blobs git cannot delta because ciphertext is incompressible. The
        # archive query is scoped to the last business day - same information
        # accumulated over time, a fraction of the bytes.
        #
        # Why a separate private repo: this repo is public. Encryption protects
        # the contents today, but public commits are permanent and mirrored, so a
        # key leak later would expose every historical statement retroactively,
        # and filenames plus blob sizes leak the trading calendar and activity
        # level through the encryption regardless.
        env:
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_ARCHIVE_QUERY_ID }}
          IBKR_FLEX_RAW_DIR: ${{ runner.temp }}/flex-raw
          ARCHIVE_KEY: ${{ secrets.IBKR_FLEX_ARCHIVE_KEY }}
          WAREHOUSE_TOKEN: ${{ secrets.WAREHOUSE_TOKEN }}
          WAREHOUSE_REPO: iamsuzerain/warehouse
        run: |
          set -euo pipefail

          # Deliberately soft failures. Breaking the daily site refresh over
          # missing archive plumbing would trade a visible problem for a worse
          # one; an error annotation is loud in the Actions UI while the
          # portfolio still updates underneath it.
          missing=""
          [ -n "${IBKR_FLEX_QUERY_ID:-}" ] || missing="$missing IBKR_FLEX_ARCHIVE_QUERY_ID"
          [ -n "${ARCHIVE_KEY:-}" ]        || missing="$missing IBKR_FLEX_ARCHIVE_KEY"
          [ -n "${WAREHOUSE_TOKEN:-}" ]    || missing="$missing WAREHOUSE_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::not archiving - missing secret(s):$missing. Today's statement is lost once it ages out of the Flex window. See scripts/ibkr-flex/README.md section 7."
            exit 0
          fi

          python3 "Suzerain Design System/ui_kits/personal_site/scripts/ibkr-flex/fetch-ibkr.py" --archive-only

          if [ -z "$(ls -A "$IBKR_FLEX_RAW_DIR" 2>/dev/null || true)" ]; then
            echo "::error::archive query returned no statement - nothing banked today"
            exit 0
          fi

          # Re-clone on every attempt rather than rebasing. Two runs can overlap
          # (cron plus a manual dispatch), and the site repo's own commit step
          # already carries a retry loop for exactly that reason. Re-cloning is
          # the simpler fix here: whatever landed meanwhile is present, the
          # skip-if-exists check below dedupes against it, and if nothing new is
          # left the loop exits clean. That also makes "first capture of a day
          # wins" fall out for free, which matters because openssl salts every
          # invocation - the same statement encrypted twice is two different
          # blobs, and without dedup a rerun would bank a duplicate.
          wh="${{ runner.temp }}/warehouse"
          pushed=""
          for attempt in 1 2 3; do
            rm -rf "$wh"
            git clone -q --depth 1 "https://x-access-token:${WAREHOUSE_TOKEN}@github.com/${WAREHOUSE_REPO}.git" "$wh"
            mkdir -p "$wh/flex-raw"

            for f in "$IBKR_FLEX_RAW_DIR"/*.xml.gz; do
              out="$wh/flex-raw/$(basename "$f").enc"
              # `if`, not `&&`: this runs under `bash -e`, where a bare
              # `[ -e ... ] && continue` that tests false exits 1 and aborts.
              if [ -e "$out" ]; then
                echo "already archived: $(basename "$out")"
                continue
              fi
              openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$f" -out "$out" -pass env:ARCHIVE_KEY
              # No byte count: these logs are public, and a daily size series
            # proxies position count and activity.
            echo "encrypted $(basename "$out")"
            done

            git -C "$wh" add flex-raw
            if git -C "$wh" diff --cached --quiet; then
              echo "nothing new to archive"
              pushed="yes"
              break
            fi
            git -C "$wh" -c user.name="portfolio-bot"                          -c user.email="portfolio-bot@users.noreply.github.com"                          commit -q -m "flex: archive $(date -u +%F)"
            if git -C "$wh" push -q; then
              echo "pushed to $WAREHOUSE_REPO"
              pushed="yes"
              break
            fi
            echo "push rejected (attempt $attempt) - refetching"
          done
          if [ -z "$pushed" ]; then
            echo "::error::could not push to $WAREHOUSE_REPO after 3 attempts - today's statement was NOT archived"
          fi

          # Never let plaintext, or a checkout holding a token, survive the step.
          rm -rf "$IBKR_FLEX_RAW_DIR" "$wh"

      - name: merge NAV history
        # Stitch today's trailing-year pnlSeries into the growing multi-year
        # history so days aged out of the Flex window are preserved (MAX range).
        run: |
          python3 "Suzerain Design System/ui_kits/personal_site/scripts/ibkr-flex/merge-nav-history.py"

      - name: fetch benchmark closes (see TICKERS in fetch-benchmarks.py)
        # Best-effort: a Yahoo hiccup shouldn't block the IBKR refresh.
        run: |
          python3 "Suzerain Design System/ui_kits/personal_site/scripts/benchmarks/fetch-benchmarks.py" \
            > /tmp/benchmarks.json \
            && mv /tmp/benchmarks.json "Suzerain Design System/ui_kits/personal_site/data/benchmarks.json" \
            || echo "benchmark fetch failed — keeping previous benchmarks.json"

      - name: commit + push if changed
        run: |
          git config user.name  "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add "Suzerain Design System/ui_kits/personal_site/data/portfolio.json" \
                  "Suzerain Design System/ui_kits/personal_site/data/nav-history.json" \
                  "Suzerain Design System/ui_kits/personal_site/data/benchmarks.json"
          # Stage first, then test the index rather than running `git diff` over
          # data/, which is blind to untracked files - benchmarks.json is created
          # fresh on a run where it did not previously exist.
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "portfolio: refresh $(date -u +%F)"
          # Remote main may have advanced since checkout (concurrent runs / other pushes).
          # Rebase onto it, keeping our freshly generated data on conflict, then retry push.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase -X theirs origin main
          done
